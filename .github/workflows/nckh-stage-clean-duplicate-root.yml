name: NCKH Staging Remove Verified Duplicate Root Assets
on:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: nckh-staging-root-dedup-exclusive
  cancel-in-progress: false
jobs:
  cleanup:
    if: >-
      github.repository == 'ngocnhanvo/nghiencuukhoahoc-actions'
      && github.event.issue.user.login == 'ngocnhanvo'
      && github.event.issue.title == '[nckh] Clean duplicate root files on staging'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - name: Exact stage FTPS cleanup with mirrored subtree preflight and protected paths
        shell: bash
        run: |
          set -euo pipefail
          set +x
          python3 - <<'PY'
          import ftplib,os,re,urllib.request,urllib.error,hashlib,time
          from urllib.parse import urlparse
          HOST='nghiencuukhoahoc.webnvn.com'
          ROOT='/domains/'+HOST+'/public_html'
          # ONLY entries confirmed from read-only listing run 39212740765.
          DUPLICATES=(
            '404.html','500.html','_astro','data','error.svg','fonts',
            'home-first','images','index.html','llms.txt','logo-first',
            'nckh-home-demo','robots.txt','sitemap.xml','so-tay','tool','xem-truoc'
          )
          PROTECTED=('client','server','.env','.htaccess','pm2-reload.txt','nckh-staging-build.json','nckh-astro.zip')
          url=os.environ['FTP_SERVER']
          host=urlparse(url if '://' in url else 'ftps://'+url)
          ftp=ftplib.FTP_TLS()
          ftp.connect(host.hostname,host.port or 21,timeout=30)
          ftp.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD'])
          ftp.prot_p()
          def listing(directory):
              ftp.cwd(directory)
              lines=[]
              ftp.retrlines('LIST',lines.append)
              out={}
              for line in lines:
                  parts=line.split(None,8)
                  if len(parts)!=9:raise RuntimeError('Unexpected FTP LIST format')
                  kind=parts[0][0]
                  name=parts[-1]
                  if name in ('.','..'):continue
                  # Protect existing owner/root dotfiles without ever including them
                  # in the fixed deletion allowlist; reject dotfiles inside copied trees.
                  if name in out or (name.startswith('.') and directory not in (ROOT,ROOT+'/client')) or not re.fullmatch(r'[^\x00-\x1f/\\]{1,255}',name):
                      raise RuntimeError('Unsafe or hidden duplicate candidate FTP entry')
                  if kind not in ('-','d'):raise RuntimeError('Unexpected symlink or special file')
                  out[name]=(kind,int(parts[4]))
              return out
          def walk(relative, client=False, depth=0):
              if depth>12:raise RuntimeError('Nested asset tree too deep')
              folder=ROOT+('/client/' if client else '/')+relative
              items=listing(folder)
              result={}
              for name,(kind,size) in items.items():
                  namepath=relative+'/'+name
                  result[namepath]=(kind,size if kind=='-' else 0)
                  if len(result)>10000:raise RuntimeError('Too many items')
                  if kind=='d':
                      result.update(walk(namepath,client,depth+1))
              return result
          def get_public(path):
              req=urllib.request.Request('https://'+HOST+path,method='GET',
                   headers={'Cache-Control':'no-cache','User-Agent':'NCKH-FTP-Dedup-Stage-Safety/1'})
              try:
                  with urllib.request.urlopen(req,timeout=18) as r:
                      body=r.read(400000)
                      return r.status,hashlib.sha256(body).hexdigest()
              except urllib.error.HTTPError as e:
                  e.close();return e.code,None
          urls=('/','/so-tay/','/xem-truoc/','/robots.txt','/sitemap.xml')
          before={p:get_public(p) for p in urls}
          print('PRE_HTTP',[(p,before[p][0]) for p in urls])
          if any(v[0]!=200 for v in before.values()):raise RuntimeError('Baseline staging page not healthy')
          roots=listing(ROOT)
          clients=listing(ROOT+'/client')
          if not all(k in roots and k in clients for k in DUPLICATES):
              raise RuntimeError('Root/client mirrored top-level file entry is missing; no deletions')
          if not all(x in roots for x in ('client','server')):
              raise RuntimeError('Canonical client/server directories missing; no deletions')
          if any(n in PROTECTED for n in DUPLICATES) or '.env' in DUPLICATES:
              raise RuntimeError('Cleanup allowlist touches protected file')
          tree={}
          all_files=0
          for name in DUPLICATES:
              if roots[name][0]!=clients[name][0]:raise RuntimeError('Mismatched type '+name)
              if roots[name][0]=='-':
                  if roots[name][1]!=clients[name][1]:raise RuntimeError('Mismatched size '+name)
                  tree[name]={'kind':'-','files':[name],'dirs':[]}
                  all_files+=1
              else:
                  root_tree=walk(name,False)
                  client_tree=walk(name,True)
                  if root_tree!=client_tree:raise RuntimeError('Mirrored tree differs '+name+'; no deletion')
                  tree[name]={
                      'kind':'d',
                      'files':sorted((n for n,(kind,s) in root_tree.items() if kind=='-'),key=lambda x:x.count('/'),reverse=True),
                      'dirs':sorted((n for n,(kind,s) in root_tree.items() if kind=='d'),key=lambda x:x.count('/'),reverse=True)
                  }
                  all_files+=len(tree[name]['files'])
          print('PREFLIGHT_PASS',len(DUPLICATES),'duplicate top-level items;',all_files,'mirrored files total')
          # No backups requested; client/ is the canonical source of exact same bytes.
          # Every delete is confined to this fixed allowlist under exact staging root.
          removed=[]
          try:
              for name in DUPLICATES:
                  t=tree[name]
                  if t['kind']=='-':
                      ftp.delete(ROOT+'/'+name)
                  else:
                      for f in t['files']:ftp.delete(ROOT+'/'+f)
                      for d in t['dirs']:ftp.rmd(ROOT+'/'+d)
                      ftp.rmd(ROOT+'/'+name)
                  removed.append(name)
                  print('REMOVED_DUPLICATE',name)
          finally:
              ftp.cwd(ROOT)
              remaining=set(listing(ROOT))
              print('POST_FTP_CANONICAL', all(x in remaining for x in ('client','server')))
              print('POST_FTP_DUPLICATES_REMAINING',sorted(set(DUPLICATES)&remaining))
              print('POST_FTP_ENV_STILL_PRESENT','.env' in remaining)
              ftp.quit()
          after={p:get_public(p) for p in urls}
          print('POST_HTTP',[(p,after[p][0],after[p][1]==before[p][1]) for p in urls])
          if after!=before:
              raise RuntimeError('Unexpected HTTP content after staging root cleanup; Node/proxy must be checked now')
          if len(removed)!=len(DUPLICATES):
              raise RuntimeError('Root cleanup incomplete; inspect staging before any new deployment')
          print('PASS: static root duplicates removed; client/server and environment files untouched; staging public pages unchanged.')
          PY