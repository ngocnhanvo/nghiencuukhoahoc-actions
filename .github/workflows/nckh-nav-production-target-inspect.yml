name: NCKH menu and production-host preflight (read-only)
on:
  issues:
    types: [opened]
permissions:
  contents: read
jobs:
  inspect:
    if: >-
      github.repository == 'ngocnhanvo/nghiencuukhoahoc-actions'
      && github.event.issue.user.login == 'ngocnhanvo'
      && github.event.issue.title == '[nckh] Inspect live menu and production FTP target'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - name: Inspect menu labels URLs, permitted FTP domains and public frontends only
        shell: bash
        run: |
          set -euo pipefail
          set +x
          python3 - <<'PY'
          import urllib.request,urllib.error,json,ftplib,os
          from urllib.parse import urlparse
          api='https://api-nghiencuukhoahoc.webnvn.com/wp-json/esc-api/v1/menus'
          req=urllib.request.Request(api,headers={'Accept':'application/json','Cache-Control':'no-cache','User-Agent':'NCKH-Safe-Menu-Preflight/1.0'})
          try:
              with urllib.request.urlopen(req,timeout=22) as resp:
                  payload=json.load(resp)
                  print('WP_MENU_API_HTTP',resp.status)
                  menus=payload.get('menus',{}) if isinstance(payload,dict) else {}
                  def safe_items(items):
                      out=[]
                      for x in (items or [])[:35]:
                          if not isinstance(x,dict):continue
                          out.append({
                            'key':str(x.get('key',''))[:75],
                            'label':str(x.get('label',''))[:85],
                            'slug':str(x.get('slug',''))[:150],
                            'href':str(x.get('href',''))[:150],
                            'linkType':str(x.get('linkType',''))[:25],
                            'children':safe_items(x.get('children') or [])[:12]
                          })
                      return out
                  for code,languages in menus.items():
                      if code.lower() not in ('header','main','primary','menu_header'):continue
                      for lang,m in languages.items():
                          if lang not in ('vi','en'):continue
                          print('WP_MENU',code,lang,'id',m.get('id'),'items',json.dumps(safe_items(m.get('items')),ensure_ascii=False))
          except Exception as e:print('WP_MENU_API_ERROR',type(e).__name__)
          val=os.environ['FTP_SERVER'];p=urlparse(val if '://' in val else 'ftps://'+val)
          ftp=ftplib.FTP_TLS();ftp.connect(p.hostname,p.port or 21,timeout=20);ftp.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD']);ftp.prot_p()
          try:
              ftp.cwd('/domains')
              domains=[x.rsplit('/',1)[-1] for x in ftp.nlst()]
              for host in ('nghiencuukhoahoc.webnvn.com','nghiencuukhoahoc.id.vn'):
                  print('FTP_DOMAIN_EXISTS',host,host in domains)
                  if host in domains:
                      try:
                          ftp.cwd('/domains/'+host+'/public_html')
                          names={x.rsplit('/',1)[-1] for x in ftp.nlst()}
                          print('FTP_WEBROOT',host,'client',('client' in names),'server',('server' in names),'provenance',('nckh-staging-build.json' in names))
                      except ftplib.all_errors:print('FTP_WEBROOT',host,'unavailable')
          finally:ftp.quit()
          for host in ('nghiencuukhoahoc.webnvn.com','nghiencuukhoahoc.id.vn'):
              for path in ('/','/so-tay'):
                  url='https://'+host+path
                  req=urllib.request.Request(url,headers={'User-Agent':'NCKH-Safe-Nav-Preflight/1.0','Cache-Control':'no-cache'})
                  try:
                      with urllib.request.urlopen(req,timeout=12) as r:
                          print('HTTP',host,path,r.status,'final_host',urlparse(r.geturl()).hostname,'html',('html' in r.headers.get('Content-Type','').lower()))
                  except Exception as e:print('HTTP',host,path,'ERROR',type(e).__name__)
          PY