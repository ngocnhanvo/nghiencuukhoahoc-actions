name: NCKH source safety lint
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  check:
    if: github.repository == 'ngocnhanvo/nghiencuukhoahoc-actions' && github.event.issue.title == '[test] NCKH isolated source' && github.event.issue.user.login == 'ngocnhanvo'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_PAT: ${{ secrets.SOURCE_REPO_PAT }}
    steps:
      - name: Lint development frontend and NCKH PHP guards
        shell: bash
        run: |
          set -euo pipefail
          set +x
          report="${RUNNER_TEMP}/source-test.md"
          printf '## NCKH isolated source lint\n\n' > "$report"
          done_report() {
            code=$?
            printf '\nOverall test exit: **%s**.\n' "$code" >> "$report"
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" -F body=@"$report" >/dev/null || true
          }
          trap done_report EXIT
          if [ -z "${SOURCE_PAT:-}" ]; then echo "SOURCE_REPO_PAT not configured"; exit 1; fi
          git config --global url."https://x-access-token:${SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
          cd "$RUNNER_TEMP"
          GIT_TERMINAL_PROMPT=0 git clone -q --depth 1 --single-branch --branch github https://github.com/ngocnhanvo/nghiencuukhoahoc-astro.git nckh-astro
          cd nckh-astro
          for file in scripts/generate-sitemap-robots.mjs scripts/sync-seo-files.mjs; do
            node --check "$file"
            printf ' - PASS Node syntax: `%s`\n' "$file" >> "$report"
          done
          if grep -q 'xuongmunonbaohiem.com' public/robots.txt public/sitemap.xml public/llms.txt; then
            printf ' - FAIL: legacy hostname in public SEO files\n' >> "$report"
            exit 1
          fi
          printf ' - PASS public SEO files do not include Blue Sea URL\n' >> "$report"
          if ! grep -q 'https://nghiencuukhoahoc.id.vn' public/robots.txt public/sitemap.xml; then
            echo 'Expected NCKH domain absent'; exit 1
          fi
          printf ' - PASS NCKH canonical domain in robots/sitemap\n' >> "$report"
          cd "$RUNNER_TEMP"
          curl -fsSL --max-time 30 -H "Authorization: Bearer ${SOURCE_PAT}" \
            -H 'Accept: application/vnd.github.raw+json' \
            "https://api.github.com/repos/ngocnhanvo/nghiencuukhoahoc-php/contents/wp-content/plugins/github-trigger/vcs-build-trigger.php?ref=master" \
            -o vcs-build-trigger.php
          curl -fsSL --max-time 30 -H "Authorization: Bearer ${SOURCE_PAT}" \
            -H 'Accept: application/vnd.github.raw+json' \
            "https://api.github.com/repos/ngocnhanvo/nghiencuukhoahoc-php/contents/wp-content/plugins/esc-visual-builder/esc-visual-builder.php?ref=master" \
            -o esc-visual-builder.php
          php -l vcs-build-trigger.php >/dev/null
          php -l esc-visual-builder.php >/dev/null
          printf ' - PASS PHP syntax for NCKH Trigger and Visual Builder\n' >> "$report"
          grep -q "define('VCS_GH_REPO', 'nghiencuukhoahoc-actions')" vcs-build-trigger.php
          grep -Fq "'nghiencuukhoahoc.id.vn'" vcs-build-trigger.php
          grep -Fq "'nghiencuukhoahoc-actions'" vcs-build-trigger.php
          printf ' - PASS Trigger destination and protective guard\n' >> "$report"
