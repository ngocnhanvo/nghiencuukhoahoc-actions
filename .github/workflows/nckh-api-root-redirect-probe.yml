name: NCKH API root redirect timing (read-only)
on:
  issues:
    types: [opened]
permissions:
  contents: read
jobs:
  headers:
    if: >-
      github.repository == 'ngocnhanvo/nghiencuukhoahoc-actions'
      && github.event.issue.user.login == 'ngocnhanvo'
      && github.event.issue.title == '[nckh] Probe API root redirect readonly'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read HTTP redirect chain and timing without session cookies or writes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess,urllib.parse
          base='https://api-nghiencuukhoahoc.webnvn.com'
          urls=['/','/admin','/admin/','/wp-admin/','/wp-login.php','/wp-json/']
          for path in urls:
              for repeat in range(1,4):
                  cmd=['curl','-sS','--http1.1','--max-time','18','-o','/dev/null','-D','-','-w',
                       '\\nTIMING http=%{http_code} redirect_count=%{num_redirects} dns=%{time_namelookup} tcp=%{time_connect} tls=%{time_appconnect} ttfb=%{time_starttransfer} total=%{time_total}\\n',base+path]
                  result=subprocess.run(cmd,capture_output=True,text=True,timeout=24)
                  print('===',path,'GET repeat',repeat,'exit',result.returncode)
                  lines=result.stdout.splitlines()
                  for line in lines:
                      lower=line.lower()
                      if lower.startswith(('http/','location:','x-redirect-by:','server:','cf-cache-status:','timing ')):
                          if lower.startswith('location:'):
                              value=line.split(':',1)[1].strip()
                              loc=urllib.parse.urlsplit(value)
                              safe=urllib.parse.urlunsplit((loc.scheme,loc.netloc,loc.path,'',''))
                              print('Location:',safe)
                          else:
                              print(line[:240])
                  if result.returncode:
                      print('curl error category:',result.returncode)
          print('GET only, no authentication, no server or FTP modifications.')
          PY
