name: NCKH read-only WordPress legacy Pages and broken media audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-pages:
    if: github.repository == 'ngocnhanvo/nghiencuukhoahoc-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect public WP Pages metadata only - no WordPress writes
        run: node scripts/nckh-wp-public-page-media-audit.mjs
      - name: Report audit-only completion
        run: echo 'Audit only: no WordPress updates, no FTP upload, no production build or cache edits.'
