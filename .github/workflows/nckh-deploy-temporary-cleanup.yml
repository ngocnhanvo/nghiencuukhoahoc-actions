name: Deploy temporary NCKH PHP cleanup
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  install:
    if: github.repository == 'ngocnhanvo/nghiencuukhoahoc-actions' && github.event.issue.user.login == 'ngocnhanvo' && github.event.issue.title == '[nckh] Deploy temporary cleanup PHP'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_PAT: ${{ secrets.SOURCE_REPO_PAT }}
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - name: Install guarded NCKH mu-plugin via encrypted FTP
        shell: bash
        run: |
          set -euo pipefail
          set +x
          report="${RUNNER_TEMP}/nckh-install.md"
          printf '## NCKH temporary PHP installation\n\n' > "$report"
          publish() {
            rc=$?
            printf '\nExit status: %s\n' "$rc" >> "$report"
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" -F body=@"$report" >/dev/null || true
          }
          trap publish EXIT
          test -n "${SOURCE_PAT:-}"
          curl -fsSL --max-time 35 -H "Authorization: Bearer ${SOURCE_PAT}" \
            -H 'Accept: application/vnd.github.raw+json' \
            'https://api.github.com/repos/ngocnhanvo/nghiencuukhoahoc-php/contents/wp-content/mu-plugins/nckh-one-time-cleanup.php?ref=master' \
            -o "${RUNNER_TEMP}/nckh-one-time-cleanup.php"
          php -l "${RUNNER_TEMP}/nckh-one-time-cleanup.php" >> "$report"
          python3 - "${RUNNER_TEMP}/nckh-one-time-cleanup.php" "$report" <<'PY'
          import os,sys,io,ftplib,hashlib,re
          from urllib.parse import urlparse
          src=open(sys.argv[1],'rb').read()
          report=sys.argv[2]
          url=os.environ['FTP_SERVER']
          parsed=urlparse(url if '://' in url else 'ftps://'+url)
          client=ftplib.FTP_TLS()
          client.connect(parsed.hostname,parsed.port or 21,timeout=15)
          client.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD'])
          client.prot_p()
          client.cwd('/domains/api-nghiencuukhoahoc.webnvn.com/public_html')
          cfg=io.BytesIO()
          client.retrbinary('RETR wp-config.php',cfg.write)
          config=cfg.getvalue().decode('utf8','replace')
          if not re.search(r"define\s*\(\s*['\"]DB_NAME['\"]\s*,\s*['\"]nghiencuukhoahoc_181026['\"]",config):
              raise RuntimeError('DB identity mismatch; deployment aborted')
          try:client.mkd('wp-content/mu-plugins')
          except ftplib.error_perm as err:
              if not str(err).startswith('550'):raise
          target='wp-content/mu-plugins/nckh-one-time-cleanup.php'
          try:
              prev=io.BytesIO()
              client.retrbinary('RETR '+target,prev.write)
              if hashlib.sha256(prev.getvalue()).digest()!=hashlib.sha256(src).digest():
                  raise RuntimeError('Different maintenance file already exists; refusing overwrite')
              state='Already installed with identical checksum'
          except ftplib.error_perm as err:
              if not str(err).startswith('550'):raise
              client.storbinary('STOR '+target,io.BytesIO(src))
              check=io.BytesIO()
              client.retrbinary('RETR '+target,check.write)
              if hashlib.sha256(src).digest()!=hashlib.sha256(check.getvalue()).digest():
                  client.delete(target)
                  raise RuntimeError('Plugin checksum mismatch, upload rolled back')
              state='Installed via encrypted FTP and checksum verified'
          client.quit()
          with open(report,'a',encoding='utf8') as f:
              f.write('- Verified NCKH database identity.\n')
              f.write('- '+state+'.\n')
              f.write('- Only new, temporary mu-plugin file was affected.\n')
          PY
