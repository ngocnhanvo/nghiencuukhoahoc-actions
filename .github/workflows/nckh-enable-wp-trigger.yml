name: Enable GitHub Trigger for NCKH only
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  enable:
    if: github.repository == 'ngocnhanvo/nghiencuukhoahoc-actions' && github.event.issue.user.login == 'ngocnhanvo' && github.event.issue.title == '[nckh] Enable WordPress GitHub Trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      WP_USER: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_PASS: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - name: Update only NCKH common-info domain and activate NCKH plugin
        shell: bash
        run: |
          set -euo pipefail
          set +x
          report="${RUNNER_TEMP}/trigger-enabled.md"
          printf '## NCKH WordPress GitHub Trigger activation\n\n' > "$report"
          publish() {
            code=$?
            printf '\nExit code: %s\n' "$code" >> "$report"
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" -F body=@"$report" >/dev/null || true
          }
          trap publish EXIT
          python3 - "$report" <<'PY'
          import os,sys,re,json,http.cookiejar,urllib.request,urllib.parse
          base='https://api-nghiencuukhoahoc.webnvn.com'
          report=sys.argv[1]
          def log(msg):
            with open(report,'a',encoding='utf8') as f:f.write(msg+'\n')
          client=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          def request(path,data=None,headers=None):
            req=urllib.request.Request(base+path,data=data,headers=headers or {})
            with client.open(req,timeout=35) as res:return res.status,res.geturl(),res.read()
          request('/wp-login.php')
          status,destination,_=request('/wp-login.php',urllib.parse.urlencode({
            'log':os.environ['WP_USER'],'pwd':os.environ['WP_PASS'],
            'wp-submit':'Log In','redirect_to':base+'/wp-admin/','testcookie':'1'
          }).encode())
          assert destination.startswith(base+'/wp-admin/'),'WP admin login failed'
          _,_,token=request('/wp-admin/admin-ajax.php?action=rest-nonce')
          nonce=token.decode().strip()
          assert re.fullmatch('[A-Za-z0-9]{10,16}',nonce),'Cannot authenticate REST'
          hdr={'X-WP-Nonce':nonce,'Content-Type':'application/json'}
          def wp(path,payload=None):
            raw=None if payload is None else json.dumps(payload,ensure_ascii=False).encode('utf8')
            status,_,body=request('/wp-json/wp/v2/'+path,raw,hdr)
            assert status==200
            return json.loads(body)
          me=wp('users/me?context=edit')
          settings=wp('settings')
          assert settings.get('url')==base and 'administrator' in me.get('roles',[]),'Wrong WP identity'
          plugins=wp('plugins?per_page=100')
          plugin=next((p for p in plugins if p.get('plugin')=='github-trigger/vcs-build-trigger'),None)
          assert plugin and plugin.get('status') in ('active','inactive'),'NCKH GitHub Trigger plugin not found'
          infos=wp('thong-tin-chung?context=edit&status=publish&per_page=20')
          assert len(infos)==1,'Expected exactly one published common-info entry'
          info=infos[0];page_id=int(info['id'])
          old=str((info.get('acf') or {}).get('domain','')).strip().removeprefix('https://').strip('/')
          dest='nghiencuukhoahoc.id.vn'
          assert old in (dest,'nghiencuukhoahoc.webnvn.com'),'Unexpected WordPress common domain; abort'
          changed=False
          if old!=dest:
            wp('thong-tin-chung/'+str(page_id),{'acf':{'domain':dest}})
            changed=True
          try:
            current=wp('thong-tin-chung/'+str(page_id)+'?context=edit')
            assert str((current.get('acf') or {}).get('domain','')).strip()==dest,'Domain ACF did not persist'
            if plugin['status']=='inactive':
              wp('plugins/github-trigger/vcs-build-trigger',{'status':'active'})
            fresh=wp('plugins?per_page=100')
            exact=next((p for p in fresh if p.get('plugin')=='github-trigger/vcs-build-trigger'),None)
            assert exact and exact.get('status')=='active','Plugin did not activate'
          except Exception:
            if changed:
              wp('thong-tin-chung/'+str(page_id),{'acf':{'domain':old}})
            raise
          log('- Site: NCKH administrator and API identity verified.')
          log('- Common info domain: `'+dest+'`'+(' (updated)' if changed else ' (already correct)')+'.')
          log('- GitHub Trigger: **active**, isolated plugin targets `ngocnhanvo/nghiencuukhoahoc-actions`.')
          log('- No FTP, Astro code or Blue Sea data changed.')
          PY
