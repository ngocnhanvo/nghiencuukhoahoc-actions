name: NCKH ESC Table and post-tag preflight
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  audit:
    if: github.repository == 'ngocnhanvo/nghiencuukhoahoc-actions' && github.event.issue.user.login == 'ngocnhanvo' && github.event.issue.title == '[nckh] Audit ESC Table and tags'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      WP_USER: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_PASS: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - name: Read only admin inventory
        shell: bash
        run: |
          set -euo pipefail
          set +x
          report="${RUNNER_TEMP}/audit.md"
          python3 - "$report" <<'PY'
          import sys,os,urllib.request,urllib.parse,urllib.error,http.cookiejar,re,json,html
          base='https://api-nghiencuukhoahoc.webnvn.com'
          out=sys.argv[1]
          cookies=http.cookiejar.CookieJar()
          client=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cookies))
          def fetch(path,post=None,headers=None):
            req=urllib.request.Request(base+path,data=post,headers=headers or {})
            with client.open(req,timeout=25) as res:return res.status,res.geturl(),dict(res.headers),res.read()
          fetch('/wp-login.php')
          _,url,_,_=fetch('/wp-login.php',post=urllib.parse.urlencode({
            'log':os.environ['WP_USER'],'pwd':os.environ['WP_PASS'],'wp-submit':'Log In',
            'redirect_to':base+'/wp-admin/','testcookie':'1'
          }).encode())
          assert url.startswith(base+'/wp-admin/'),'WP login unverified'
          _,_,_,nonce=fetch('/wp-admin/admin-ajax.php?action=rest-nonce')
          token=nonce.decode().strip()
          assert re.fullmatch('[a-zA-Z0-9]{10,16}',token),'WP nonce unavailable'
          headers={'X-WP-Nonce':token}
          def api(route):
            code,_,meta,raw=fetch('/wp-json/wp/v2/'+route,headers=headers)
            assert code==200
            return json.loads(raw),meta
          settings,_=api('settings')
          user,_=api('users/me?context=edit')
          plugins,_=api('plugins?per_page=100')
          assert settings.get('url')==base and 'administrator' in user.get('roles',[]),'Wrong WP site'
          tg=next((p for p in plugins if p.get('plugin')=='github-trigger/vcs-build-trigger'),{})
          assert tg.get('status')=='inactive','GitHub Trigger unexpectedly active'
          tags,h=api('tags?per_page=1&context=edit')
          tag_total=int(h.get('X-WP-Total','0'))
          pages,h=api('pages?per_page=100&context=edit')
          ref_pages={}
          for p in pages:
            body=str(p.get('content',{}).get('raw',''))
            refs=re.findall(r'\[(?:table|tablepress)\b[^\]]*\bid\s*=\s*["\']?([a-zA-Z0-9_-]+)',body,re.I)
            if refs:ref_pages[p.get('slug','')]=sorted(set(refs))
          wpstatus,wpurl,_,tablehtml=fetch('/wp-admin/admin.php?page=tablepress')
          raw=tablehtml.decode('utf8','replace')
          title=re.search(r'<title[^>]*>(.*?)</title>',raw,re.I|re.S)
          ids=sorted(set(re.findall(r'(?:table_id=|tablepress_table_|data-table-id=["\'])([\w-]+)',raw)))
          info=[
            '## NCKH ESC Table / tags — read-only preflight','',
            '- WordPress identity: verified NCKH HTTPS, administrator.',
            '- GitHub Trigger: inactive.',
            '- WordPress post tags: **'+str(tag_total)+'**.',
            '- Pages reviewed: **'+str(len(pages))+'** (including draft).',
            '- Pages with inline ESC Table references: `'+json.dumps(ref_pages,ensure_ascii=False)+'`.',
            '- ESC Table admin HTTP status: **'+str(wpstatus)+'**.',
            '- ESC Table admin URL: `'+wpurl.split('?')[0]+'`.',
            '- ESC Table admin page title: `'+html.unescape(re.sub('<[^>]+>','',title.group(1)))[:120] if title else 'unknown'+'`.',
            '- Table IDs glimpsed in admin HTML (may include UI elements): `'+', '.join(ids[:60])+'`.',
            '',
            'No WP data was changed. ESC Tables may also be referenced in other ACF fields, page builder or options not exposed by this audit.'
          ]
          with open(out,'w',encoding='utf8') as fp:fp.write('\n'.join(info)+'\n')
          PY
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" -F body=@"$report" >/dev/null
