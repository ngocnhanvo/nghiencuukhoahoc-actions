name: NCKH provision signed GitHub deployment key
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  provision:
    if: github.repository == 'ngocnhanvo/nghiencuukhoahoc-actions' && github.event.issue.user.login == 'ngocnhanvo' && github.event.issue.title == '[nckh] Provision deployment credential'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      SOURCE_PAT: ${{ secrets.SOURCE_REPO_PAT }}
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      ENV_FILE: ${{ secrets.ENV_FILE }}
      ASTRO_FTP_TARGET: /domains/nghiencuukhoahoc.webnvn.com/public_html/
      FTP_ASTRO_DIR: /domains/nghiencuukhoahoc.webnvn.com/public_html/
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Prepare NCKH-only authenticated wp-config deploy key with private backup
        shell: bash
        run: |
          set -euo pipefail
          set +x
          report="${RUNNER_TEMP}/result.md"
          printf '## NCKH signed deploy key provisioning\n\n' > "$report"
          end() {
            rc=$?
            printf '\nExit code: %s\n' "$rc" >> "$report"
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" -F body=@"$report" >/dev/null || true
          }
          trap end EXIT
          python3 - "$report" <<'PY'
          import io,ftplib,hashlib,os,re,time,sys
          from urllib.parse import urlparse
          report=sys.argv[1]
          pat=os.environ.get('SOURCE_PAT','')
          assert len(pat)>=20 and '\n' not in pat and '\r' not in pat, 'SOURCE_REPO_PAT secret invalid'
          url=os.environ['FTP_SERVER']
          p=urlparse(url if '://' in url else 'ftps://'+url)
          ftp=ftplib.FTP_TLS()
          ftp.connect(p.hostname,p.port or 21,timeout=17)
          ftp.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD'])
          ftp.prot_p()
          ftp.cwd('/domains/api-nghiencuukhoahoc.webnvn.com')
          b=io.BytesIO()
          ftp.retrbinary('RETR public_html/wp-config.php',b.write)
          original=b.getvalue()
          config=original.decode('utf8')
          assert 'nghiencuukhoahoc_181026' in config, 'Wrong NCKH DB; refusing'
          assert len(original)>500 and len(original)<200000, 'Unexpected wp-config'
          marker='VCS_GH_ACTIONS_TOKEN'
          existing=re.search(r'define\s*\(\s*[\'\"]'+marker+r'[\'\"]\s*,\s*([\'\"])(.*?)\1\s*\)', config, re.S)
          if existing:
            assert existing.group(2)==pat,'Configured deployment credential differs from GitHub secret; refusing overwrite'
            msg='Existing NCKH deployment token matches configured GitHub secret; no change.'
          else:
            assert marker not in config,'Unrecognized runtime key definition; refusing write'
            assert re.search(r'require_once\s+ABSPATH\s*\.\s*[\'\"]wp-settings\.php[\'\"]',config), 'Expected wp-config bootstrap marker not found'
            escape=pat.replace('\\','\\\\').replace("'","\\'")
            addition="define('VCS_GH_ACTIONS_TOKEN', '"+escape+"');\n"
            config,n=re.subn(r'(?=require_once\s+ABSPATH\s*\.\s*[\'\"]wp-settings\.php[\'\"])',lambda _:addition,config,count=1)
            assert n==1 and config.count(marker)==1,'Failed to insert credential once'
            staged=config.encode('utf8')
            stamp=str(int(time.time()))
            safe='nckh-config-backups'
            try:ftp.mkd(safe)
            except ftplib.error_perm as e:
              if not str(e).startswith('550'):raise
            backup=safe+'/wp-config-before-deploy-key-'+stamp+'.php.txt'
            stage=safe+'/wp-config-deploy-key-'+stamp+'.php.txt'
            old_path=safe+'/wp-config-predeploy-original-'+stamp+'.php.txt'
            ftp.storbinary('STOR '+backup,io.BytesIO(original))
            ftp.storbinary('STOR '+stage,io.BytesIO(staged))
            chk=io.BytesIO()
            ftp.retrbinary('RETR '+stage,chk.write)
            assert hashlib.sha256(chk.getvalue()).digest()==hashlib.sha256(staged).digest(),'Staging checksum mismatch'
            moved=False
            try:
              ftp.rename('public_html/wp-config.php',old_path)
              moved=True
              ftp.rename(stage,'public_html/wp-config.php')
              check=io.BytesIO()
              ftp.retrbinary('RETR public_html/wp-config.php',check.write)
              assert hashlib.sha256(check.getvalue()).digest()==hashlib.sha256(staged).digest(),'Deployment checksum mismatch'
              msg='Added NCKH deployment token to wp-config.php, preserved private original and verified bytes.'
            except Exception:
              if moved:
                try:ftp.delete('public_html/wp-config.php')
                except ftplib.all_errors:pass
                ftp.rename(old_path,'public_html/wp-config.php')
              raise
          ftp.quit()
          with open(report,'a',encoding='utf8') as out:
            out.write('- WordPress database identity checked.\n')
            out.write('- '+msg+'\n')
            out.write('- Credential value intentionally withheld. No Blue Sea paths touched.\n')
          PY
