name: Import Blue Sea baseline (one-time)

on:
  workflow_dispatch:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: nghiencuukhoahoc-blue-sea-import
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'ngocnhanvo/nghiencuukhoahoc-actions' && (github.event_name != 'issues' || github.event.issue.title == '[bootstrap] Import Blue Sea baseline')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
      GH_TOKEN: ${{ github.token }}
      ISSUE_NO: ${{ github.event.issue.number }}
    steps:
      - name: Copy baseline to independent repositories (no deployment)
        shell: bash
        run: |
          set -euo pipefail
          PHASE='start'
          report_failure() {
            code=$?
            if [ "$code" -ne 0 ]; then
              echo "::error::Import phase=${PHASE}, status=${code}, run=${GITHUB_RUN_ID}"
              if [ -n "${ISSUE_NO:-}" ]; then
                gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NO}/comments" -f body="Import FAILED during phase: ${PHASE}; exit status: ${code}; run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null || true
              fi
            fi
          }
          trap report_failure EXIT
          if [ -z "${REPO_PAT:-}" ]; then
            echo "::error::SOURCE_REPO_PAT is not configured in nghiencuukhoahoc-actions"
            exit 1
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global url."https://x-access-token:${REPO_PAT}@github.com/".insteadOf "https://github.com/"
          work="${RUNNER_TEMP}/nghiencuukhoahoc-import"
          mkdir -p "$work"

          copy_code() {
            local source="$1" dest="$2"
            rsync -a --delete \
              --exclude '/.git/' \
              --exclude '/README.md' \
              --exclude '/.github/workflows/' \
              --exclude '/.env' --exclude '/.env.*' \
              --exclude '/wp-config.php' \
              --exclude '*.pem' --exclude '*.key' \
              "$source/" "$dest/"
          }
          commit_if_changed() {
            local dest="$1" message="$2"
            git -C "$dest" add -A
            if ! git -C "$dest" diff --cached --quiet; then
              git -C "$dest" commit -m "$message"
            fi
          }
          ensure_absent() {
            local repo="$1"; shift
            local branch
            for branch in "$@"; do
              if git ls-remote --exit-code --heads "https://github.com/${repo}.git" "refs/heads/${branch}" >/dev/null; then
                echo "::error::Refusing to overwrite ${repo}@${branch} (already exists)"
                exit 1
              fi
            done
          }
          clone_branch() {
            local repo="$1" branch="$2" folder="$3"
            git clone --depth 1 --single-branch --branch "$branch" "https://github.com/${repo}.git" "$folder"
          }

          PHASE="astro"
          PHASE="read-source-preflight"
          for entry in \
            "ngocnhanvo/xuongmunonbaohiem-astro github" \
            "ngocnhanvo/xuongmunonbaohiem-php master" \
            "ngocnhanvo/xuongmunonbaohiem-actions main"; do
            read -r repo branch <<< "$entry"
            if ! git ls-remote --exit-code "https://github.com/${repo}.git" "refs/heads/${branch}" >/dev/null; then
              echo "::error::SOURCE_REPO_PAT cannot read ${repo}@${branch}"
              exit 1
            fi
            echo "Confirmed source PAT read: ${repo}@${branch}"
          done
          PHASE="read-target-preflight"
          for repo in \
            ngocnhanvo/nghiencuukhoahoc-astro \
            ngocnhanvo/nghiencuukhoahoc-php \
            ngocnhanvo/nghiencuukhoahoc-actions; do
            if ! git ls-remote --exit-code "https://github.com/${repo}.git" "refs/heads/main" >/dev/null; then
              echo "::error::SOURCE_REPO_PAT cannot access ${repo}. Grant Contents read/write on the destination."
              exit 1
            fi
            echo "Confirmed target PAT read: ${repo}"
          done

          echo "::group::Import Astro"
          ensure_absent ngocnhanvo/nghiencuukhoahoc-astro master github
          clone_branch ngocnhanvo/nghiencuukhoahoc-astro main "$work/dest-astro"
          clone_branch ngocnhanvo/xuongmunonbaohiem-astro master "$work/src-astro-master"
          clone_branch ngocnhanvo/xuongmunonbaohiem-astro github "$work/src-astro-github"
          git -C "$work/dest-astro" switch -c github
          copy_code "$work/src-astro-github" "$work/dest-astro"
          commit_if_changed "$work/dest-astro" "chore: import Blue Sea Astro github development baseline"
          git -C "$work/dest-astro" push origin github
          echo "Astro github: $(git -C "$work/dest-astro" rev-parse HEAD)"
          git -C "$work/dest-astro" switch -c master
          copy_code "$work/src-astro-master" "$work/dest-astro"
          commit_if_changed "$work/dest-astro" "chore: initialize production from imported Blue Sea baseline"
          git -C "$work/dest-astro" push origin master
          echo "Astro master: $(git -C "$work/dest-astro" rev-parse HEAD)"
          echo "::endgroup::"

          PHASE="php"
          echo "::group::Import PHP without active Blue Sea workflows"
          ensure_absent ngocnhanvo/nghiencuukhoahoc-php master
          clone_branch ngocnhanvo/nghiencuukhoahoc-php main "$work/dest-php"
          clone_branch ngocnhanvo/xuongmunonbaohiem-php master "$work/src-php"
          git -C "$work/dest-php" switch -c master
          copy_code "$work/src-php" "$work/dest-php"
          if [ -d "$work/src-php/.github/workflows" ]; then
            mkdir -p "$work/dest-php/.github/blue-sea-workflows-disabled"
            rsync -a "$work/src-php/.github/workflows/" "$work/dest-php/.github/blue-sea-workflows-disabled/"
          fi
          commit_if_changed "$work/dest-php" "chore: import Blue Sea PHP baseline with deploy workflows disabled"
          git -C "$work/dest-php" push origin master
          echo "PHP master: $(git -C "$work/dest-php" rev-parse HEAD)"
          echo "::endgroup::"

          PHASE="actions"
          echo "::group::Import Actions assets with workflows disabled"
          clone_branch ngocnhanvo/nghiencuukhoahoc-actions main "$work/dest-actions"
          clone_branch ngocnhanvo/xuongmunonbaohiem-actions main "$work/src-actions"
          rsync -a \
            --exclude '/.git/' --exclude '/README.md' \
            --exclude '/.github/workflows/' \
            --exclude '/.env' --exclude '/.env.*' \
            --exclude '*.pem' --exclude '*.key' \
            "$work/src-actions/" "$work/dest-actions/"
          if [ -d "$work/src-actions/.github/workflows" ]; then
            mkdir -p "$work/dest-actions/.github/blue-sea-workflows-disabled"
            rsync -a "$work/src-actions/.github/workflows/" "$work/dest-actions/.github/blue-sea-workflows-disabled/"
          fi
          cat > "$work/dest-actions/IMPORT_STATUS.md" <<'STATUS'
          # Blue Sea baseline imported
          Origin: ngocnhanvo/xuongmunonbaohiem-{astro,php,actions}
          Destination: ngocnhanvo/nghiencuukhoahoc-{astro,php,actions}

          All source CI deployment workflows are retained at
          .github/blue-sea-workflows-disabled/ and cannot run automatically.

          No deploy is permitted until the new domain, WordPress settings,
          build environment, FTP endpoints and secrets are checked and updated.
          STATUS
          commit_if_changed "$work/dest-actions" "chore: import Blue Sea Actions assets without enabling deployments"
          git -C "$work/dest-actions" push origin main
          echo "Actions main: $(git -C "$work/dest-actions" rev-parse HEAD)"
          echo "::endgroup::"

  report:
    if: always() && github.event_name == 'issues' && github.event.issue.title == '[bootstrap] Import Blue Sea baseline'
    needs: [import]
    runs-on: ubuntu-latest
    steps:
      - name: Post import outcome for verification
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ needs.import.result }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Blue Sea baseline import workflow result: **' + status + '**. Run: https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + '. Deployment remains disabled.'
            });
