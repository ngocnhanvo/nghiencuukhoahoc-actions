name: NCKH changed Astro components parse
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  validate:
    if: github.repository == 'ngocnhanvo/nghiencuukhoahoc-actions' && github.event.issue.title == '[nckh] Parse changed Astro'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SOURCE_PAT: ${{ secrets.SOURCE_REPO_PAT }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate syntax of changed Astro files without build or deploy
        shell: bash
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/report.md"
          printf '## NCKH modified Astro file parse\n\n' > "$report"
          done_report() {
            rc=$?
            printf '\nValidation exit code: %s\n' "$rc" >> "$report"
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" -F body=@"$report" >/dev/null || true
          }
          trap done_report EXIT
          git config --global url."https://x-access-token:${SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
          cd "${RUNNER_TEMP}"
          git clone -q --depth 1 --single-branch --branch github https://github.com/ngocnhanvo/nghiencuukhoahoc-astro.git source
          cd source
          printf 'Astro github commit: `%s`\n\n' "$(git rev-parse HEAD)" >> "$report"
          corepack enable >/dev/null 2>&1
          corepack prepare pnpm@9 --activate >/dev/null 2>&1
          if ! pnpm install --frozen-lockfile --ignore-scripts > "${RUNNER_TEMP}/install.log" 2>&1; then
            printf 'Dependency installation failed:\\n' >> "$report"
            tail -n 14 "${RUNNER_TEMP}/install.log" >> "$report"
            exit 1
          fi
          printf 'Dependencies installed.\\n' >> "$report"
          set +e
          node --input-type=module > "${RUNNER_TEMP}/parse.log" 2>&1 <<'NODE'
          import { createRequire } from 'node:module';
          // pnpm isolates transitive dependencies; resolve the compiler from Astro.
          const resolveFromAstro = createRequire(import.meta.resolve('astro'));
          const { transform } = await import(resolveFromAstro.resolve('@astrojs/compiler'));
          import { readFile } from 'node:fs/promises';
          const files = [
            'src/astro/pages/HomePage.astro',
            'src/astro/components/Layout/Header.astro',
            'src/astro/components/Layout/Footer.astro',
            'src/astro/components/Layout/Layout.astro',
            'src/astro/components/Layout/Head.astro',
            'src/pages/nckh-home-demo.astro'
          ];
          for (const path of files) {
            await transform(await readFile(path,'utf8'),{filename:path});
            console.log('PASS '+path);
          }
          NODE
          parse_result=$?
          set -e
          cat "${RUNNER_TEMP}/parse.log" >> "$report"
          if [ "$parse_result" -ne 0 ]; then exit "$parse_result"; fi
          if pnpm exec vitest run \
            src/astro/components/Layout/Header.research-layout.test.ts \
            src/astro/components/Layout/Header.mobile-sticky.test.ts \
            src/astro/components/Layout/headerScrollState.research.test.ts \
            > "${RUNNER_TEMP}/header-tests.log" 2>&1; then
            printf '\nEduResearch header regression tests: **PASS**.\n' >> "$report"
            grep -E 'Test Files|Tests  ' "${RUNNER_TEMP}/header-tests.log" >> "$report" || true
          else
            printf '\nEduResearch header regression tests: **FAIL**.\n' >> "$report"
            tail -n 55 "${RUNNER_TEMP}/header-tests.log" >> "$report"
            exit 1
          fi
          printf '\nNo FTP, WordPress writes, merge or deployment.\n' >> "$report"
