name: Archive cloned Blue Sea published content in NCKH (reversible)
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  archive:
    if: github.repository == 'ngocnhanvo/nghiencuukhoahoc-actions' && github.event.issue.user.login == 'ngocnhanvo' && github.event.issue.title == '[nckh] Draft legacy content'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      WP_USER: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_PASS: ${{ secrets.WP_ADMIN_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify NCKH identity and mark legacy content draft (no deletion)
        shell: bash
        run: |
          set -euo pipefail
          set +x
          report="${RUNNER_TEMP}/archive-report.md"
          printf '## NCKH legacy content archival\n\n' > "$report"
          result() {
            code=$?
            printf '\nRunner exit code: **%s**.\n' "$code" >> "$report"
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" -F body=@"$report" >/dev/null || true
          }
          trap result EXIT
          python3 - "$report" <<'PY'
          import sys,os,json,re,urllib.request,urllib.parse,http.cookiejar
          report=sys.argv[1]
          base='https://api-nghiencuukhoahoc.webnvn.com'
          jar=http.cookiejar.CookieJar()
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          def do(url,data=None,headers=None):
            req=urllib.request.Request(url,data=data,headers=headers or {})
            with opener.open(req,timeout=24) as r:return r.status,r.geturl(),r.read()
          def log(txt):
            with open(report,'a',encoding='utf8') as out:out.write(txt+'\n')
          def get(endpoint):
            status,url,raw=do(base+'/wp-json/wp/v2/'+endpoint,headers={'X-WP-Nonce':nonce})
            assert status==200,(endpoint,status)
            return json.loads(raw)
          def update(kind,id):
            payload=json.dumps({'status':'draft'}).encode()
            status,url,data=do(base+'/wp-json/wp/v2/'+kind+'/'+str(id),payload,
              {'X-WP-Nonce':nonce,'Content-Type':'application/json'})
            assert status==200,(kind,id,status)
            result=json.loads(data)
            assert result.get('status')=='draft',"Status change did not persist"
          assert os.getenv('WP_USER') and os.getenv('WP_PASS'),"Missing NCKH credential secret"
          do(base+'/wp-login.php')
          params=urllib.parse.urlencode({'log':os.environ['WP_USER'],'pwd':os.environ['WP_PASS'],
            'wp-submit':'Log In','redirect_to':base+'/wp-admin/','testcookie':'1'}).encode()
          code,final,_=do(base+'/wp-login.php',params)
          assert final.startswith(base+'/wp-admin'),"WordPress login not verified"
          _,_,value=do(base+'/wp-admin/admin-ajax.php?action=rest-nonce')
          nonce=value.decode().strip()
          assert re.fullmatch('[A-Za-z0-9]{10,16}',nonce),"No WP REST nonce"
          settings=get('settings')
          me=get('users/me?context=edit')
          assert settings.get('url')==base and 'administrator' in me.get('roles',[]),"Wrong website or no administrator role"
          plugins=get('plugins?per_page=100')
          trigger=next((p for p in plugins if p.get('plugin')=='github-trigger/vcs-build-trigger'),None)
          assert trigger and trigger.get('status')=='inactive',"Trigger not inactive — refusing writes"
          log('Site identity verified: NCKH over HTTPS; GitHub Trigger inactive.')
          keep={'trang-chu','ve-chung-toi','lien-he','tin-tuc','bai-viet','cau-hoi-lien-quan','chinh-sach-bao-mat-thong-tin',
            'quen-mat-khau','dat-lai-mat-khau'}
          irrelevant={'bo-suu-tap','chinh-sach-giao-hang-van-chuyen','giao-hang-thanh-toan','chinh-sach-doi-tra',
            'san-pham','lich-su-mua-hang','thanh-toan-hoan-tat','checkout','cart','thanh-toan-don-hang','gio-hang',
            'xuong-san-xuat-non-bao-hiem-mu-bao-hiem-theo-yeu-cau-blue-sea','san-xuat-mu-bao-hiem-quang-cao',
            'nhan-san-xuat-mu-bao-hiem-quang-cao-chat-luong'}
          pages=get('pages?per_page=100&context=edit')
          changed=[]
          for p in pages:
            slug=p.get('slug','')
            if slug not in irrelevant or p.get('status')!='publish':continue
            update('pages',p['id'])
            changed.append((p['id'],slug))
          log('Pages moved from published to draft: **'+str(len(changed))+'**.')
          for pid,slug in changed:log('- Page ID '+str(pid)+': `'+slug+'`')
          log('Preserved shared/reusable pages: '+', '.join(sorted(keep)))
          import urllib.error
          examined=0;archived=0;page=1;targets=[]
          legacy=re.compile('xuongmunonbaohiem|blue.?sea|mũ bảo hiểm|nón bảo hiểm|non bao hiem|mu bao hiem',re.I)
          while examined<500:
            try:
              batch=get('posts?per_page=100&page='+str(page)+'&status=publish&context=edit')
            except urllib.error.HTTPError as error:
              if error.code==400:break
              raise
            if not batch:break
            for post in batch:
              examined+=1
              if examined>500:break
              text=' '.join(str(v) for v in (post.get('slug',''),
                post.get('title',{}).get('raw',''),post.get('content',{}).get('raw',''),
                post.get('excerpt',{}).get('raw','')))
              if legacy.search(text):targets.append(post['id'])
            if len(batch)<100:break
            page+=1
          for post_id in targets:
            update('posts',post_id)
            archived+=1
          log('Published posts reviewed: **'+str(examined)+'**. Set to draft: **'+str(archived)+'**.')
          log('No permanent deletion; uploads/ESC Table/WooCommerce products untouched.')
          PY
