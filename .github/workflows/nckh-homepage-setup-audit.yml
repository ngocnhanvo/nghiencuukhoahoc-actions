name: NCKH Homepage Setup Audit
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  check:
    if: github.repository == 'ngocnhanvo/nghiencuukhoahoc-actions' && github.event.issue.user.login == 'ngocnhanvo' && github.event.issue.title == '[nckh] Homepage setup audit'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      WP_USER: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_PASS: ${{ secrets.WP_ADMIN_PASSWORD }}
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - name: Check Page 248, ACF, FTP, and environment
        shell: bash
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/report.md"
          python3 - "$report" <<'PY'
          import os,sys,json,re,urllib.request,urllib.parse,http.cookiejar,ftplib
          from urllib.parse import urlparse
          out=sys.argv[1];base='https://api-nghiencuukhoahoc.webnvn.com'
          jar=http.cookiejar.CookieJar()
          browser=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          def get(path,body=None,headers=None):
            req=urllib.request.Request(base+path,data=body,headers=headers or {})
            with browser.open(req,timeout=26) as r:return r.status,r.geturl(),r.read()
          get('/wp-login.php')
          status,final,_=get('/wp-login.php',urllib.parse.urlencode({'log':os.environ['WP_USER'],'pwd':os.environ['WP_PASS'],'wp-submit':'Log In','redirect_to':base+'/wp-admin/','testcookie':'1'}).encode())
          assert final.startswith(base+'/wp-admin/'),'Admin login failed'
          _,_,nonce=get('/wp-admin/admin-ajax.php?action=rest-nonce')
          assert re.fullmatch('[A-Za-z0-9]{10,16}',nonce.decode().strip()),'No nonce'
          hdr={'X-WP-Nonce':nonce.decode().strip()}
          def api(path):
            r,_,payload=get('/wp-json/wp/v2/'+path,headers=hdr)
            assert r==200,(path,r)
            return json.loads(payload)
          s=api('settings');me=api('users/me?context=edit')
          assert s.get('url')==base and 'administrator' in me.get('roles',[]),'Wrong WP site'
          page=api('pages/248?context=edit')
          acf=page.get('acf') or {}
          assert page.get('slug')=='trang-chu' and acf.get('key')=='home' and acf.get('action')=='HomePage','Page mismatch'
          plugins=api('plugins?per_page=100')
          trigger=next((p for p in plugins if p.get('plugin')=='github-trigger/vcs-build-trigger'),{})
          assert trigger.get('status')=='inactive','GitHub Trigger must be inactive'
          report=['## NCKH homepage WordPress/FTP readiness','','- Page #248, action=HomePage, key=home: verified.',
                  '- ACF keys: '+', '.join(sorted(acf.keys())),
                  '- Existing content length: '+str(len(page.get('content',{}).get('raw',''))),
                  '- GitHub Trigger inactive.','','### Actions environment keys (values withheld)']
          env=os.environ.get('ENV_FILE','')
          for key in ['WC_URL','WC_URL_CLIENT','DOMAIN','FTP_REMOTE_DIR','DEPLOY_DIR','FTP_PATH','ROOT_DIR']:
            m=re.search(r'^'+key+r'=(.*)$',env,re.M)
            if m:
              val=m.group(1).strip()
              kind='NCKH' if 'nghiencuukhoahoc' in val else ('Blue Sea legacy' if 'xuongmunonbaohiem' in val else 'other')
              report.append('- '+key+': present ('+kind+')')
            else:report.append('- '+key+': missing')
          ftphost=os.environ['FTP_SERVER']
          parsed=urlparse(ftphost if '://' in ftphost else 'ftps://'+ftphost)
          ftp=ftplib.FTP_TLS()
          ftp.connect(parsed.hostname,parsed.port or 21,timeout=18)
          ftp.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD']);ftp.prot_p()
          folder='/domains/nghiencuukhoahoc.webnvn.com/public_html'
          ftp.cwd(folder)
          names=[x.split('/')[-1] for x in ftp.nlst()]
          report+=['','### Exact Astro FTPS target','- Path: '+folder,'- Encrypted FTPS access: yes','- Root names: '+', '.join(names[:20])]
          ftp.quit()
          with open(out,'w',encoding='utf8') as f:f.write('\n'.join(report)+'\n')
          PY
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" -F body=@"$report" >/dev/null
