name: NCKH staging homepage asset smoke test
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  qa:
    if: github.event.issue.user.login == 'ngocnhanvo' && github.event.issue.title == '[nckh] Test published homepage assets'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify live homepage, H1, local compiled CSS and JS files
        shell: bash
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/assets.md"
          printf '## EduResearch published homepage CSS/JS smoke test\n\n' > "$report"
          finish() {
            rc=$?
            printf '\nExit status: %s\n' "$rc" >> "$report"
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" -F body=@"$report" >/dev/null || true
          }
          trap finish EXIT
          python3 - "$report" <<'PY'
          from html.parser import HTMLParser
          from urllib.parse import urljoin,urlsplit
          from urllib.request import Request,urlopen
          import re,sys
          base='http://nghiencuukhoahoc.webnvn.com/'
          report=sys.argv[1]
          def log(text):
              with open(report,'a',encoding='utf8') as w:w.write(text+'\n')
          def get(url):
              request=Request(url,headers={'User-Agent':'EduResearch-QA/1.0'})
              with urlopen(request,timeout=20) as r:return r.status,r.read(400000)
          status,html=get(base)
          assert status==200
          src=html.decode('utf8','replace')
          assert 'data-nckh-home="2026"' in src and 'EduResearch Hub' in src
          assert 'xuongmunonbaohiem' not in src.lower(),'Legacy Blue Sea hostname in live page'
          class Extract(HTMLParser):
              def __init__(self):
                  super().__init__();self.assets=[];self.h1=0;self.title=False
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='h1':self.h1+=1
                  if tag=='link' and ('stylesheet' in a.get('rel','') or 'icon' in a.get('rel','')):
                      self.assets.append(a.get('href',''))
                  if tag=='script' and a.get('src'):self.assets.append(a['src'])
                  if tag=='img' and a.get('src'):self.assets.append(a['src'])
          parsed=Extract();parsed.feed(src)
          local=[]
          for a in parsed.assets:
              if not a or a.startswith('data:'):continue
              url=urljoin(base,a)
              if urlsplit(url).hostname=='nghiencuukhoahoc.webnvn.com':
                  local.append(url)
          local=list(dict.fromkeys(local))[:35]
          log('- Live index: HTTP 200; EduResearch marker and branding present.')
          log('- Number of H1 elements: **'+str(parsed.h1)+'**.')
          log('- Same-origin CSS, JS, and image assets to check: **'+str(len(local))+'**.')
          missing=[]
          for url in local:
              try:
                  result,body=get(url)
                  if result!=200 or not body:raise RuntimeError('empty/non-200')
              except Exception as e:
                  missing.append((urlsplit(url).path,type(e).__name__))
          log('- Successful asset URLs: **'+str(len(local)-len(missing))+'**.')
          for path,error in missing[:15]:log('  - Unavailable: `'+path+'` ('+error+')')
          log('- HTTPS / public .id.vn DNS is outside this HTTP asset smoke test.')
          if missing:raise RuntimeError(str(len(missing))+' essential local assets unavailable on staging')
          PY
