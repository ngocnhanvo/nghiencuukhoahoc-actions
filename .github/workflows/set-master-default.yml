name: Set master as default and remove main

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: nghiencuukhoahoc-repo-default-branch
  cancel-in-progress: false

jobs:
  update-default-branches:
    if: github.repository == 'ngocnhanvo/nghiencuukhoahoc-actions' && github.event.issue.title == '[maint] Make master default' && github.event.issue.user.login == 'ngocnhanvo'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_PAT: ${{ secrets.SOURCE_REPO_PAT }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Set default branch and delete main only after verification
        shell: bash
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/branch-report.md"
          printf '## NCKH repository default branch update\n\n' > "$report"
          success=0
          on_exit() {
            exitcode=$?
            if [ "$exitcode" -eq 0 ]; then
              printf '\nResult: **SUCCESS**. Astro and PHP should use `master` as default. Actions was untouched.\n' >> "$report"
            else
              printf '\nResult: **FAILED** (exit %s). Check the log. Existing `main` is never deleted unless default was first changed and verified.\n' "$exitcode" >> "$report"
            fi
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@"$report" >/dev/null || true
          }
          trap on_exit EXIT

          if [ -z "${TARGET_PAT:-}" ]; then
            echo "::error::SOURCE_REPO_PAT is missing in nghiencuukhoahoc-actions"
            printf 'Secret SOURCE_REPO_PAT is missing.\n' >> "$report"
            exit 1
          fi

          repos=(nghiencuukhoahoc-astro nghiencuukhoahoc-php)

          get_default() {
            GH_TOKEN="$TARGET_PAT" gh api "repos/ngocnhanvo/$1" --jq '.default_branch'
          }
          get_branch_sha() {
            GH_TOKEN="$TARGET_PAT" gh api "repos/ngocnhanvo/$1/git/ref/heads/$2" --jq '.object.sha'
          }
          printf '| Repo | Before | master SHA | After | main deleted |\n|---|---|---|---|---|\n' >> "$report"
          declare -A before_sha
          for repo in "${repos[@]}"; do
            current=$(get_default "$repo")
            if [ "$current" != "main" ] && [ "$current" != "master" ]; then
              printf 'Refused to edit %s because default branch is %s, not main/master.\n' "$repo" "$current" >> "$report"
              exit 1
            fi
            before_sha[$repo]=$(get_branch_sha "$repo" master)
            echo "Preflight $repo: default=$current, master exists at ${before_sha[$repo]}"
          done

          # Two-phase update: point both repositories to master before any main deletion.
          for repo in "${repos[@]}"; do
            current=$(get_default "$repo")
            if [ "$current" = "main" ]; then
              echo "Changing default branch to master on $repo"
              if ! GH_TOKEN="$TARGET_PAT" gh api -X PATCH "repos/ngocnhanvo/$repo" -f default_branch=master --jq '.default_branch'; then
                echo "::error::Could not change default branch for $repo. SOURCE_REPO_PAT may need Administration: Read and write."
                printf 'Could not change default for `%s`. PAT may need **Administration: Read and write**.\n' "$repo" >> "$report"
                exit 1
              fi
            fi
            actual=$(get_default "$repo")
            if [ "$actual" != master ]; then
              printf 'Default branch verification failed for `%s`: %s.\n' "$repo" "$actual" >> "$report"
              exit 1
            fi
            echo "Verified $repo default is master"
          done

          for repo in "${repos[@]}"; do
            actual=$(get_default "$repo")
            if [ "$actual" != master ]; then
              printf 'Refusing to delete main: `%s` default changed unexpectedly.\n' "$repo" >> "$report"
              exit 1
            fi
            sha=$(get_branch_sha "$repo" master)
            if [ "$sha" != "${before_sha[$repo]}" ]; then
              printf 'Refusing to delete main: `%s` master SHA changed during migration.\n' "$repo" >> "$report"
              exit 1
            fi
            if GH_TOKEN="$TARGET_PAT" gh api "repos/ngocnhanvo/$repo/git/ref/heads/main" >/dev/null 2>&1; then
              echo "Deleting old main on $repo"
              if ! GH_TOKEN="$TARGET_PAT" gh api -X DELETE "repos/ngocnhanvo/$repo/git/refs/heads/main" >/dev/null; then
                printf 'Failed to delete `%s@main`, but default already set to master.\n' "$repo" >> "$report"
                exit 1
              fi
            fi
            current=$(get_default "$repo")
            if [ "$current" != master ]; then
              printf 'Final verification failed for %s.\n' "$repo" >> "$report"
              exit 1
            fi
            if GH_TOKEN="$TARGET_PAT" gh api "repos/ngocnhanvo/$repo/git/ref/heads/main" >/dev/null 2>&1; then
              printf 'main is still present on %s.\n' "$repo" >> "$report"
              exit 1
            fi
            printf '| %s | main or master | %s | master | yes |\n' "$repo" "$sha" >> "$report"
          done
          echo "All requested default branch changes and deletions verified."
