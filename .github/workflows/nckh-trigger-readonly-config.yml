name: NCKH GitHub Trigger configuration audit
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  audit:
    if: github.event.issue.user.login == 'ngocnhanvo' && github.event.issue.title == '[nckh] Inspect trigger configuration'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      WP_USER: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_PASS: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - name: Read non-sensitive WordPress origin and GitHub destination metadata
        shell: bash
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/report.md"
          python3 - "$report" <<'PY'
          import sys,os,ftplib,io,re,urllib.request,urllib.parse,http.cookiejar,json
          from urllib.parse import urlparse
          out=sys.argv[1]
          lines=['## NCKH GitHub Trigger destination checks','']
          origin='https://api-nghiencuukhoahoc.webnvn.com'
          jar=http.cookiejar.CookieJar()
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          def get(path,data=None,headers=None):
            with opener.open(urllib.request.Request(origin+path,data=data,headers=headers or {}),timeout=22) as r:return r.read()
          get('/wp-login.php')
          get('/wp-login.php',urllib.parse.urlencode({
            'log':os.environ['WP_USER'],'pwd':os.environ['WP_PASS'],'wp-submit':'Log In',
            'redirect_to':origin+'/wp-admin/','testcookie':'1'}).encode())
          nonce=get('/wp-admin/admin-ajax.php?action=rest-nonce').decode().strip()
          assert re.fullmatch('[A-Za-z0-9]{10,16}',nonce)
          headers={'X-WP-Nonce':nonce}
          records=json.loads(get('/wp-json/wp/v2/thong-tin-chung?per_page=10&context=edit',headers=headers))
          for i,p in enumerate(records[:5]):
            domain=str((p.get('acf') or {}).get('domain') or '')
            lines.append('- Info record #'+str(p['id'])+' domain: `'+domain[:150]+'`')
          ftpstr=os.environ['FTP_SERVER']
          p=urlparse(ftpstr if '://' in ftpstr else 'ftps://'+ftpstr)
          conn=ftplib.FTP_TLS();conn.connect(p.hostname,p.port or 21,timeout=17)
          conn.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD']);conn.prot_p()
          conn.cwd('/domains/api-nghiencuukhoahoc.webnvn.com/public_html')
          data=io.BytesIO();conn.retrbinary('RETR wp-config.php',data.write);conn.quit()
          content=data.getvalue().decode('utf8','replace')
          for key in ['VCS_GH_OWNER','VCS_GH_REPO']:
            match=re.search(r'define\s*\(\s*[\'\"]'+key+r'[\'\"]\s*,\s*[\'\"]([^\'\"]+)[\'\"]',content)
            lines.append('- wp-config `'+key+'`: `'+match.group(1)+'`' if match else '- wp-config `'+key+'`: not overridden (uses plugin default)')
          lines.append('- Deploy HMAC token configured: '+('yes' if 'VCS_GH_ACTIONS_TOKEN' in content else 'no')+' (value never displayed).')
          lines.append('\nRead-only inspection. No WP/FTP code or options were modified.')
          with open(out,'w',encoding='utf8') as f:f.write('\n'.join(lines)+'\n')
          PY
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" -F body=@"$report" >/dev/null
