name: NCKH HTTPS options safe update
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  normalize:
    if: github.repository == 'ngocnhanvo/nghiencuukhoahoc-actions' && github.event.issue.user.login == 'ngocnhanvo' && github.event.issue.title == '[nckh] Normalize WP HTTPS'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      WP_USER: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_PASS: ${{ secrets.WP_ADMIN_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Update WordPress URLs only after checking and preserving all form values
        shell: bash
        run: |
          set -euo pipefail
          set +x
          report="${RUNNER_TEMP}/https-report.md"
          printf '## NCKH HTTPS normalization\n\n' > "$report"
          report_finished() {
            rc=$?
            printf '\nOperation exit code: %s\n' "$rc" >> "$report"
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" -F body=@"$report" >/dev/null || true
          }
          trap report_finished EXIT
          python3 - "$report" <<'PY'
          import os, sys, ssl, urllib.request, urllib.parse, http.cookiejar, json
          from html.parser import HTMLParser
          base="https://api-nghiencuukhoahoc.webnvn.com"
          target=base
          report=sys.argv[1]
          class FormFields(HTMLParser):
              def __init__(self):
                  super().__init__();self.inside=False;self.inputs=[];self.select=None;self.option=None;self.textarea=None
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=="form" and "options.php" in a.get("action",""): self.inside=True
                  if not self.inside:return
                  if tag=="input":
                      name=a.get("name","")
                      typ=a.get("type","text").lower()
                      if name and typ not in ("submit","button","reset","file","image") and "disabled" not in a:
                          if typ in ("radio","checkbox") and "checked" not in a:return
                          self.inputs.append((name,a.get("value","on")))
                  if tag=="textarea":self.textarea={"name":a.get("name",""),"value":""}
                  if tag=="select":self.select={"name":a.get("name",""),"value":None,"default":None}
                  if tag=="option" and self.select is not None:
                      self.option=(a.get("value",""),"selected" in a)
              def handle_data(self,s):
                  if self.textarea is not None:self.textarea["value"]+=s
              def handle_endtag(self,tag):
                  if tag=="option" and self.option is not None:
                      value,chosen=self.option
                      if self.select["default"] is None:self.select["default"]=value
                      if chosen:self.select["value"]=value
                      self.option=None
                  if tag=="select" and self.select is not None:
                      if self.select["name"]:
                          value=self.select["value"]
                          self.inputs.append((self.select["name"],self.select["default"] if value is None else value))
                      self.select=None
                  if tag=="textarea" and self.textarea is not None:
                      if self.textarea["name"]:self.inputs.append((self.textarea["name"],self.textarea["value"]))
                      self.textarea=None
                  if tag=="form" and self.inside:self.inside=False
          jar=http.cookiejar.CookieJar()
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          def fetch(url,data=None,headers=None):
              req=urllib.request.Request(url,data=data,headers=headers or {})
              with opener.open(req,timeout=23) as res:return res.status,res.geturl(),res.read()
          def log(s):
              with open(report,"a",encoding="utf8") as f:f.write(s+"\n")
          assert os.getenv("WP_USER") and os.getenv("WP_PASS"),"Missing administrator secrets"
          fetch(base+"/wp-login.php")
          credentials=urllib.parse.urlencode({
             "log":os.environ["WP_USER"],"pwd":os.environ["WP_PASS"],"wp-submit":"Log In",
             "redirect_to":base+"/wp-admin/","testcookie":"1"}).encode()
          status,url,_=fetch(base+"/wp-login.php",credentials)
          assert url.startswith(base+"/wp-admin"),"Login not verified"
          st,url,doc=fetch(base+"/wp-admin/options-general.php")
          assert st==200 and b"options.php" in doc,"General settings form missing"
          p=FormFields();p.feed(doc.decode("utf8","replace"))
          params=p.inputs
          values=dict(params)
          old_siteurl=values.get("siteurl","")
          old_home=values.get("home","")
          log("Previous siteurl: `"+old_siteurl+"`")
          log("Previous home: `"+old_home+"`")
          assert old_siteurl in (base,"http://api-nghiencuukhoahoc.webnvn.com"),"Unexpected WordPress site URL, refuse"
          assert old_home in (base,"http://api-nghiencuukhoahoc.webnvn.com"),"Unexpected WordPress home URL, refuse"
          assert values.get("option_page")=="general" and values.get("action")=="update" and values.get("_wpnonce"),"Invalid WordPress form metadata"
          assert len(params)>=11,"Not enough settings fields to preserve data, refuse"
          post=[(k,base if k in ("siteurl","home") else v) for k,v in params]
          if old_siteurl==base and old_home==base:
              log("Already HTTPS; nothing changed.")
              sys.exit(0)
          log("Preserving "+str(len(params))+" general-settings form values; updating only siteurl and home.")
          code,final,_=fetch(base+"/wp-admin/options.php",urllib.parse.urlencode(post).encode())
          assert code==200 and final.startswith(base+"/wp-admin"),"Options update request did not complete normally"
          _,_,rest=fetch(base+"/wp-json/")
          api=json.loads(rest)
          actual=api.get("url","")
          log("Public REST URL after update: `"+actual+"`")
          if actual!=base:
              log("REST URL did not switch; do not assume HTTPS normalization succeeded.")
              sys.exit(2)
          _,login_final,_=fetch(base+"/wp-admin/options-general.php")
          log("WordPress admin accessible over HTTPS: **"+("yes" if login_final.startswith(base+"/wp-admin/") else "no")+"**.")
          assert login_final.startswith(base+"/wp-admin/"),"Cannot verify admin login after update"
          log("Result: HTTPS siteurl/home update verified.")
          PY
