name: Isolate NCKH GitHub Trigger from Blue Sea
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  isolate:
    if: github.repository == 'ngocnhanvo/nghiencuukhoahoc-actions' && github.event.issue.title == '[safety] Disable NCKH GitHub Trigger' && github.event.issue.user.login == 'ngocnhanvo'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      WP_USER: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_PASS: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - name: Confirm NCKH identity, disable trigger and verify
        shell: bash
        run: |
          set -euo pipefail
          set +x
          host="https://api-nghiencuukhoahoc.webnvn.com"
          report="${RUNNER_TEMP}/trigger-isolation.md"
          jar="${RUNNER_TEMP}/wp-cookies"
          printf '## NCKH GitHub Trigger isolation\n\n' > "$report"
          finish() {
            result=$?
            if [ "$result" -ne 0 ]; then
              printf 'Stopped with exit code %s. WordPress may be unchanged; check the runner log.\n' "$result" >> "$report"
            fi
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" -F body=@"$report" >/dev/null || true
          }
          trap finish EXIT
          [ -n "${WP_USER:-}" ] && [ -n "${WP_PASS:-}" ] || { echo 'Credentials missing'; exit 1; }
          curl -ksS -L -m 18 -b "$jar" -c "$jar" "$host/wp-login.php" -o /dev/null
          curl -ksS -L -m 20 --max-redirs 4 -b "$jar" -c "$jar" \
            --data-urlencode "log=$WP_USER" --data-urlencode "pwd=$WP_PASS" \
            --data-urlencode 'wp-submit=Log In' --data-urlencode "redirect_to=$host/wp-admin/" \
            --data-urlencode 'testcookie=1' "$host/wp-login.php" -o /dev/null
          nonce=$(curl -ksS -m 15 -b "$jar" -c "$jar" "$host/wp-admin/admin-ajax.php?action=rest-nonce")
          [[ "$nonce" =~ ^[a-zA-Z0-9]{10,16}$ ]] || { echo "No REST nonce"; exit 1; }
          curl -ksS -m 15 -b "$jar" -c "$jar" -H "X-WP-Nonce: $nonce" "$host/wp-json/wp/v2/settings" -o "${RUNNER_TEMP}/settings.json"
          site=$(jq -r '.url // ""' "${RUNNER_TEMP}/settings.json")
          title=$(jq -r '.title // ""' "${RUNNER_TEMP}/settings.json")
          printf 'Verified site name: **%s**, WordPress address: `%s`.\n\n' "$title" "$site" >> "$report"
          case "$site" in *api-nghiencuukhoahoc.webnvn.com*) ;; *) echo 'Not NCKH. Refusing mutation'; exit 1;; esac
          purl="$host/wp-json/wp/v2/plugins/github-trigger/vcs-build-trigger"
          current=$(curl -ksS -m 15 -b "$jar" -c "$jar" -H "X-WP-Nonce: $nonce" "$purl")
          slug=$(echo "$current" | jq -r '.plugin // ""')
          before=$(echo "$current" | jq -r '.status // "error"')
          printf 'Plugin `%s` previous status: **%s**.\n\n' "$slug" "$before" >> "$report"
          [ "$slug" = 'github-trigger/vcs-build-trigger' ] || { echo "Unexpected plugin response"; exit 1; }
          if [ "$before" = 'active' ]; then
            updated=$(curl -ksS -m 22 -b "$jar" -c "$jar" -H "X-WP-Nonce: $nonce" \
              -X POST --data-urlencode 'status=inactive' "$purl")
            after=$(echo "$updated" | jq -r '.status // "error"')
          else
            after="$before"
          fi
          [ "$after" = inactive ] || { echo "Deactivation not confirmed"; exit 1; }
          latest=$(curl -ksS -m 15 -b "$jar" -c "$jar" -H "X-WP-Nonce: $nonce" "$purl" | jq -r '.status // "error"')
          printf 'Plugin status after: **%s**; independent confirmation: **%s**.\n\n' "$after" "$latest" >> "$report"
          [ "$latest" = inactive ] || exit 1
          printf 'Only the GitHub Trigger plugin in the NCKH WordPress installation was disabled. No post/media content or Blue Sea sites were changed.\n' >> "$report"
