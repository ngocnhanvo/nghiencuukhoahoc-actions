name: Move NCKH blog posts into WordPress Trash
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
concurrency:
  group: nckh-blog-post-trash-only
  cancel-in-progress: false
jobs:
  trash:
    if: github.repository == 'ngocnhanvo/nghiencuukhoahoc-actions' && github.event.issue.user.login == 'ngocnhanvo' && github.event.issue.title == '[nckh] Move all blog posts to Trash'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      WP_USER: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_PASS: ${{ secrets.WP_ADMIN_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Move WordPress blog posts only to Trash and verify results
        shell: bash
        run: |
          set -euo pipefail
          set +x
          report="${RUNNER_TEMP}/nckh-trash-report.md"
          printf '## NCKH WordPress blog post Trash operation\n\n' > "$report"
          finish() {
            result=$?
            printf '\nExit code: **%s**.\n' "$result" >> "$report"
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" -F body=@"$report" >/dev/null || true
          }
          trap finish EXIT
          python3 - "$report" <<'PY'
          import os,sys,time,json,re,urllib.request,urllib.parse,urllib.error,http.cookiejar,concurrent.futures
          report=sys.argv[1]
          host='https://api-nghiencuukhoahoc.webnvn.com'
          def out(line):
            with open(report,'a',encoding='utf8') as f:f.write(line+'\n')
          assert os.environ.get('WP_USER') and os.environ.get('WP_PASS'), 'Missing WordPress credentials'
          jar=http.cookiejar.CookieJar()
          client=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          def request(path,body=None,method=None,headers=None,timeout=40):
            req=urllib.request.Request(host+path,data=body,method=method,headers=headers or {})
            with client.open(req,timeout=timeout) as res:
              payload=res.read()
              return (json.loads(payload) if 'application/json' in res.headers.get('Content-Type','') else payload),dict(res.headers)
          request('/wp-login.php')
          request('/wp-login.php',body=urllib.parse.urlencode({
            'log':os.environ['WP_USER'],'pwd':os.environ['WP_PASS'],
            'wp-submit':'Log In','redirect_to':host+'/wp-admin/','testcookie':'1'
          }).encode())
          nonce_bytes,_=request('/wp-admin/admin-ajax.php?action=rest-nonce')
          nonce=nonce_bytes.decode('utf8').strip()
          assert re.fullmatch('[A-Za-z0-9]{10,16}',nonce),'Could not verify WordPress login'
          cookie_header='; '.join(c.name+'='+c.value for c in jar)
          auth={'X-WP-Nonce':nonce,'Cookie':cookie_header,'Accept':'application/json'}
          def get(route):
            return request('/wp-json/wp/v2/'+route,headers=auth)
          settings,_=get('settings')
          user,_=get('users/me?context=edit')
          plugins,_=get('plugins?per_page=100')
          assert settings.get('url')==host,'Site is not NCKH; refusing changes'
          assert 'administrator' in user.get('roles',[]),'Administrator role missing'
          trigger=next((p for p in plugins if p.get('plugin')=='github-trigger/vcs-build-trigger'),{})
          assert trigger.get('status')=='inactive','GitHub Trigger must remain inactive'
          out('Verified site **NCKH**, administrator role and inactive GitHub Trigger.')
          out('Scope: only WordPress core `post`. This operation moves to Trash, does NOT empty Trash.')
          statuses=('publish','draft','pending','private','future')
          def list_first(status):
            query=urllib.parse.urlencode({'status':status,'per_page':50,'page':1,'context':'edit','_fields':'id,type,status'})
            try:
              items,headers=get('posts?'+query)
              if not isinstance(items,list):raise RuntimeError('Unexpected WordPress response')
              if any(x.get('type')!='post' for x in items):raise RuntimeError('Non-blog post type returned')
              return items,int(headers.get('X-WP-Total','0'))
            except urllib.error.HTTPError as e:
              if e.code==400 and status in ('pending','private','future'):return [],0
              raise
          before={status:list_first(status)[1] for status in statuses}
          out('Before: '+json.dumps(before))
          moved=0
          failures=[]
          start=time.monotonic()
          def move_one(item):
            url='/wp-json/wp/v2/posts/'+str(item['id'])
            for attempt in range(3):
              try:
                result,_=request(url,method='DELETE',headers=auth)
                if isinstance(result,dict) and result.get('deleted') is False:
                  return True,item['id']
                if isinstance(result,dict) and result.get('deleted') is True:
                  return False,item['id']
                return False,item['id']
              except urllib.error.HTTPError as e:
                if e.code==404:return True,item['id']
                if attempt==2 or e.code not in (429,500,502,503,504):return False,item['id']
              except Exception:
                if attempt==2:return False,item['id']
              time.sleep(attempt+1)
            return False,item['id']
          while time.monotonic()-start<47*60:
            batch=[]
            for state in statuses:
              batch,_=list_first(state)
              if batch:break
            if not batch:break
            with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              answers=list(pool.map(move_one,batch[:30]))
            successes=sum(1 for good,pid in answers if good)
            moved+=successes
            failures.extend(pid for good,pid in answers if not good)
            if failures or successes==0:
              out('Stopped because a batch could not be fully moved; failed IDs count: '+str(len(failures)))
              break
            if moved%300<30:
              out('Progress: '+str(moved)+' blog posts moved to Trash.')
          after={status:list_first(status)[1] for status in statuses}
          trash_total=list_first('trash')[1] if False else None
          out('Posts moved to Trash in this run: **'+str(moved)+'**.')
          out('Remaining outside Trash: '+json.dumps(after))
          if sum(after.values())==0:out('Verified: no published/draft/pending/private/future blog posts remain.')
          else:out('Some blog posts remain outside Trash; another pass required.')
          if failures:sys.exit(2)
          PY
