name: NCKH Home Deployment Preflight
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  audit:
    if: github.repository == 'ngocnhanvo/nghiencuukhoahoc-actions' && github.event.issue.user.login == 'ngocnhanvo' && github.event.issue.title == '[nckh] Homepage deployment preflight'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
      WP_USER: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_PASS: ${{ secrets.WP_ADMIN_PASSWORD }}
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - name: Audit NCKH frontend FTP, WordPress pages and live website (read-only)
        shell: bash
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/home-audit.md"
          python3 - "$report" <<'PY'
          import sys,os,json,urllib.request,urllib.parse,http.cookiejar,ftplib,ssl
          from urllib.parse import urlparse
          out=sys.argv[1]
          backend='https://api-nghiencuukhoahoc.webnvn.com'
          def note(s):
            with open(out,'a',encoding='utf8') as f:f.write(s+'\n')
          note('## NCKH Homepage deployment preflight\n')
          jar=http.cookiejar.CookieJar()
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          def get(path,data=None,headers=None):
            req=urllib.request.Request(backend+path,data=data,headers=headers or {})
            with opener.open(req,timeout=22) as res:return res.status,res.geturl(),res.read()
          get('/wp-login.php')
          st,link,_=get('/wp-login.php',urllib.parse.urlencode({
            'log':os.environ['WP_USER'],'pwd':os.environ['WP_PASS'],
            'wp-submit':'Log In','redirect_to':backend+'/wp-admin/','testcookie':'1'
          }).encode())
          assert link.startswith(backend+'/wp-admin/'),'WP Admin authentication failed'
          _,_,nonce=get('/wp-admin/admin-ajax.php?action=rest-nonce')
          nonce=nonce.decode().strip()
          st,_,raw=get('/wp-json/wp/v2/pages?context=edit&per_page=100&_fields=id,status,slug,link,title,acf',
            headers={'X-WP-Nonce':nonce})
          assert st==200
          pages=json.loads(raw)
          note('### WordPress Pages')
          for p in pages:
            acf=p.get('acf') or {}
            label=p.get('title',{}).get('raw','')
            # Do not show full content, tokens or any private page data.
            note('- #'+str(p['id'])+' `'+p['slug']+'` ('+p['status']+') key=`'+str(acf.get('key',''))+'` action=`'+str(acf.get('action',''))+'`')
          note('\n### Frontend availability')
          for host in ('nghiencuukhoahoc.id.vn','nghiencuukhoahoc.webnvn.com'):
            url='https://'+host+'/'
            try:
              request=urllib.request.Request(url,headers={'User-Agent':'NCKH-Deployment-Audit/1.0'})
              with urllib.request.urlopen(request,timeout=15) as r:
                note('- '+host+': HTTP '+str(r.status)+' final host '+(urlparse(r.geturl()).hostname or ''))
            except Exception as e:
              note('- '+host+': unavailable / '+type(e).__name__)
          note('\n### FTPS NCKH frontend directory checks')
          ftpstr=os.environ['FTP_SERVER']
          parsed=urlparse(ftpstr if '://' in ftpstr else 'ftps://'+ftpstr)
          ftp=ftplib.FTP_TLS()
          ftp.connect(parsed.hostname,parsed.port or 21,timeout=16)
          ftp.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD'])
          ftp.prot_p()
          for folder in ('/domains/nghiencuukhoahoc.id.vn/public_html',
                         '/domains/nghiencuukhoahoc.webnvn.com/public_html'):
            try:
              ftp.cwd(folder)
              names=ftp.nlst()
              note('- `'+folder+'`: exists, root items='+str(len(names)))
              note('  - files expected of Astro: '+', '.join(x for x in ('index.html','server','client','_astro','.htaccess') if any(n.endswith('/'+x) or n==x for n in names)))
            except ftplib.all_errors as e:
              note('- `'+folder+'`: not accessible ('+type(e).__name__+')')
          ftp.quit()
          note('\nNo WordPress, GitHub source or FTP files were modified.')
          PY
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" -F body=@"$report" >/dev/null
