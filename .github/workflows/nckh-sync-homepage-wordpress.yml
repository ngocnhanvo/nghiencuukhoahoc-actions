name: Sync approved EduResearch homepage to WordPress
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  sync:
    if: github.repository == 'ngocnhanvo/nghiencuukhoahoc-actions' && github.event.issue.user.login == 'ngocnhanvo' && github.event.issue.title == '[nckh] Sync EduResearch homepage'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_PAT: ${{ secrets.SOURCE_REPO_PAT }}
      WP_USER: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_PASS: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - name: Fetch verified NCKH Astro development content
        shell: bash
        run: |
          set -euo pipefail
          set +x
          curl -fsSL --max-time 30 -H "Authorization: Bearer ${SOURCE_PAT}" -H 'Accept: application/vnd.github.raw+json' \
            'https://api.github.com/repos/ngocnhanvo/nghiencuukhoahoc-astro/contents/src/content/nckh-home-initial.html?ref=github' \
            -o "${RUNNER_TEMP}/home.html"
          curl -fsSL --max-time 30 -H "Authorization: Bearer ${SOURCE_PAT}" -H 'Accept: application/vnd.github.raw+json' \
            'https://api.github.com/repos/ngocnhanvo/nghiencuukhoahoc-astro/contents/src/styles/eduresearch-home.css?ref=github' \
            -o "${RUNNER_TEMP}/home.css"
      - name: Update WordPress Page ID 248 with backup and rollback
        shell: bash
        run: |
          set -euo pipefail
          set +x
          report="${RUNNER_TEMP}/home-result.md"
          printf '## NCKH EduResearch Homepage WordPress sync\n\n' > "$report"
          finish() {
            rc=$?
            printf '\nOperation exit code: %s\n' "$rc" >> "$report"
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" -F body=@"$report" >/dev/null || true
          }
          trap finish EXIT
          python3 - "${RUNNER_TEMP}/home.html" "${RUNNER_TEMP}/home.css" "${RUNNER_TEMP}/home-old.json" "$report" <<'PY'
          import os,sys,re,json,urllib.request,urllib.parse,http.cookiejar,urllib.error
          content=open(sys.argv[1],encoding='utf8').read()
          css=open(sys.argv[2],encoding='utf8').read()
          oldpath=sys.argv[3]
          report=sys.argv[4]
          target='https://api-nghiencuukhoahoc.webnvn.com'
          if any(s in content.lower() for s in ['xuongmunonbaohiem','blue sea','<script','<style']):
            raise RuntimeError('Unexpected legacy domain or script/style in WordPress HTML')
          for needed in ['data-nckh-home="2026"','EduResearch Hub','Sổ tay NCKH','Quản lý kỹ năng','Học sinh','Giáo viên','nd-choose-journal','nd-choose-skills']:
            if needed not in content:raise RuntimeError('Homepage markup incomplete')
          if len(css)<9000 or len(content)<8000:raise RuntimeError('Unexpected homepage asset size')
          def log(v):
            with open(report,'a',encoding='utf8') as out:out.write(v+'\n')
          jar=http.cookiejar.CookieJar()
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          def fetch(path,data=None,headers=None):
            req=urllib.request.Request(target+path,data=data,headers=headers or {})
            with opener.open(req,timeout=30) as response:
              raw=response.read()
              return response.status,response.geturl(),json.loads(raw) if 'json' in response.headers.get('Content-Type','') else raw
          fetch('/wp-login.php')
          _,url,_=fetch('/wp-login.php',urllib.parse.urlencode({
            'log':os.environ['WP_USER'],'pwd':os.environ['WP_PASS'],
            'wp-submit':'Log In','redirect_to':target+'/wp-admin/','testcookie':'1'
          }).encode())
          assert url.startswith(target+'/wp-admin'),'WordPress login failed'
          _,_,nonce=fetch('/wp-admin/admin-ajax.php?action=rest-nonce')
          nonce=nonce.decode().strip()
          assert re.fullmatch('[A-Za-z0-9]{10,16}',nonce),'REST nonce invalid'
          hdr={'X-WP-Nonce':nonce,'Content-Type':'application/json'}
          def wp_get(route):
            return fetch('/wp-json/wp/v2/'+route,headers=hdr)[2]
          settings=wp_get('settings')
          user=wp_get('users/me?context=edit')
          plugins=wp_get('plugins?per_page=100')
          assert settings.get('url')==target and 'administrator' in user.get('roles',[]),'NCKH identity failed'
          assert any(p.get('plugin')=='github-trigger/vcs-build-trigger' and p.get('status')=='inactive' for p in plugins),'Trigger must be disabled'
          page=wp_get('pages/248?context=edit')
          assert page.get('slug')=='trang-chu' and page.get('acf',{}).get('key')=='home' and page.get('acf',{}).get('action')=='HomePage','Page ID mismatch'
          old={
            'title':page.get('title',{}).get('raw',''),
            'content':page.get('content',{}).get('raw',''),
            'excerpt':page.get('excerpt',{}).get('raw',''),
            'acf':{'cssmore':page.get('acf',{}).get('cssmore','')}
          }
          with open(oldpath,'w',encoding='utf8') as backup:json.dump(old,backup,ensure_ascii=False)
          def wp_save(doc):
            data=json.dumps(doc,ensure_ascii=False).encode('utf8')
            return fetch('/wp-json/wp/v2/pages/248',data,hdr)[2]
          payload={
            'title':'EduResearch Hub – Nhật ký nghiên cứu khoa học',
            'excerpt':'Nhật ký khoa học dành cho học sinh, nơi giáo viên góp ý và cùng đánh giá tiến độ, tư duy và bốn kỹ năng nghiên cứu.',
            'content':content,
            'acf':{'cssmore':css}
          }
          try:
            wp_save(payload)
            updated=wp_get('pages/248?context=edit')
            raw=updated.get('content',{}).get('raw','')
            saved_css=str(updated.get('acf',{}).get('cssmore',''))
            expected=['data-nckh-home="2026"','Sổ tay NCKH','Quản lý kỹ năng','nd-choose-skills','nd-mobile-toggle']
            if any(v not in raw for v in expected):raise RuntimeError('Saved homepage content lost required components')
            if 'nd-choose-journal:checked' not in saved_css or len(saved_css)<9000:
              raise RuntimeError('ACF cssmore not persisted')
            if updated.get('acf',{}).get('key')!='home' or updated.get('acf',{}).get('action')!='HomePage':
              raise RuntimeError('Action/key altered unexpectedly')
          except Exception:
            wp_save(old)
            log('Update failed validation; rolled back to previous WP content/CSS.')
            raise
          log('Updated WordPress Page #248, action=HomePage, key=home.')
          log('Stored HTML in WordPress page content: '+str(len(raw))+' chars.')
          log('Stored style in ACF cssmore: '+str(len(saved_css))+' chars.')
          log('Both CSS-only tabs and mobile menu retained; no scripts or ESC Table shortcodes injected.')
          log('Previous data saved in private Actions artifact for rollback.')
          PY
      - name: Preserve private WordPress page rollback data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nckh-homepage-248-before
          path: ${{ runner.temp }}/home-old.json
          if-no-files-found: ignore
          retention-days: 7
