name: NCKH Staging Static Asset Isolation (reversible)
on:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: nckh-staging-asset-isolation
  cancel-in-progress: false
jobs:
  probe:
    if: >-
      github.repository == 'ngocnhanvo/nghiencuukhoahoc-actions'
      && github.event.issue.user.login == 'ngocnhanvo'
      && github.event.issue.title == '[nckh] Test staging asset copies safely'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - name: Temporarily hide matching root assets and restore after HTTP comparison
        shell: bash
        run: |
          set -euo pipefail
          set +x
          python3 - <<'PY'
          import ftplib,hashlib,os,re,urllib.request,urllib.error
          from urllib.parse import urlparse,quote
          root='/domains/nghiencuukhoahoc.webnvn.com/public_html'
          origin='https://nghiencuukhoahoc.webnvn.com'
          candidates=(
              ('_astro','.css'),('_astro','.js'),
              ('fonts','.woff2'),('home-first','.png'),
              ('tool','.webp'),('', 'robots.txt'),('','sitemap.xml'),
          )
          def public_probe(sub,name):
              url=origin+'/'+('/'.join(filter(None,(sub,name))))
              req=urllib.request.Request(url,method='GET',headers={
                'Cache-Control':'no-cache','User-Agent':'NCKH-Root-Asset-Isolation/1'
              })
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self,*args,**kwargs):return None
              try:
                  with urllib.request.build_opener(NoRedirect).open(req,timeout=12) as r:
                      body=r.read(1000000)
                      return r.status,hashlib.sha256(body).hexdigest(),r.headers.get('Content-Type','')
              except urllib.error.HTTPError as e:
                  e.close();return e.code,None,''
          url=os.environ['FTP_SERVER'];u=urlparse(url if '://' in url else 'ftps://'+url)
          ftp=ftplib.FTP_TLS();ftp.connect(u.hostname,u.port or 21,timeout=25)
          ftp.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD']);ftp.prot_p()
          tested=0;failure=False
          try:
              for sub,ending in candidates:
                  try:
                      ftp.cwd(root+('/'+sub if sub else ''))
                      names=[n.rsplit('/',1)[-1] for n in ftp.nlst()]
                  except ftplib.all_errors:
                      print('SKIP',sub,ending,'directory inaccessible')
                      continue
                  names=[n for n in names if (n.endswith(ending) if ending.startswith('.') else n==ending) and re.fullmatch(r'[A-Za-z0-9_.-]+',n)]
                  chosen=None
                  for n in sorted(names):
                      try:
                          s=ftp.size(n)
                          if s is not None and 0<s<650000:
                              chosen=n;break
                      except ftplib.all_errors:pass
                  if not chosen:
                      print('SKIP',sub,ending,'no safe file')
                      continue
                  base=public_probe(sub,chosen)
                  if base[0]!=200:
                      print('SKIP',sub,ending,'baseline HTTP',base[0])
                      continue
                  guard='.nckh-asset-isolation-20261019-'+chosen
                  if guard in names:raise RuntimeError('Temporary FTP file already exists')
                  moved=False
                  try:
                      ftp.rename(chosen,guard);moved=True
                      compare=public_probe(sub,chosen)
                      result=compare[0]==200 and compare[1]==base[1]
                      print('ASSET',sub or 'root',ending,'no_root_file_HTTP',compare[0],'identical',result)
                      failure=failure or not result
                      tested+=1
                  finally:
                      if moved:ftp.rename(guard,chosen)
                  restored=public_probe(sub,chosen)
                  if restored[0]!=200 or restored[1]!=base[1]:raise RuntimeError('Asset restoration failed')
          finally:
              ftp.quit()
          print('ASSET_TEST_TOTAL',tested,'ASSET_TEST_FAILURE',failure)
          if failure:raise SystemExit(2)
          if tested<3:raise SystemExit('Insufficient live assets to approve bulk removal')
          print('PASS staging static asset isolation; original FTP files always restored')
          PY