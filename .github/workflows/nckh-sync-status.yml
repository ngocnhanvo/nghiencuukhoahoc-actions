name: Read NCKH Trigger source deployment failure
on:
  issues:
    types: [opened]
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  check:
    if: github.event.issue.user.login == 'ngocnhanvo' && github.event.issue.title == '[nckh] Diagnose live Trigger synchronization'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Report run IDs and failed steps only
        shell: bash
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/status.md"
          echo '## Recent Trigger sync workflow runs' > "$report"
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/nckh-sync-live-trigger.yml/runs?per_page=4" \
            --jq '.workflow_runs[]|"- Run "+(.id|tostring)+" status="+.status+" conclusion="+(.conclusion//"unknown")+" "+.html_url' >> "$report"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" -F body=@"$report" >/dev/null
