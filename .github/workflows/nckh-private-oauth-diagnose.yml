name: NCKH Private OAuth Staging Read Only Diagnostics
on:
  issues:
    types: [opened]
permissions:
  contents: read
jobs:
  check:
    if: >-
      github.repository == 'ngocnhanvo/nghiencuukhoahoc-actions'
      && github.event.issue.user.login == 'ngocnhanvo'
      && github.event.issue.title == '[nckh] Diagnose staging OAuth private file'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - name: Inspect private file permissions and structure without logging any secret
        shell: bash
        run: |
          set -euo pipefail
          set +x
          python3 - <<'PY'
          import base64,ftplib,io,json,os,re
          from urllib.parse import urlparse
          raw=os.environ['FTP_SERVER']
          addr=urlparse(raw if '://' in raw else 'ftps://'+raw)
          conn=ftplib.FTP_TLS()
          conn.connect(addr.hostname,addr.port or 21,timeout=30)
          conn.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD'])
          conn.prot_p()
          root='/domains/nghiencuukhoahoc.webnvn.com'
          conn.cwd(root)
          if 'nghiencuukhoahoc.webnvn.com' not in conn.pwd():
              raise RuntimeError('Unexpected FTP domain directory')
          info=[]
          try:conn.retrlines('LIST',info.append)
          except ftplib.all_errors:pass
          folder=next((x for x in info if x.rstrip().endswith(' nckh-private-runtime')),None)
          folder_private=bool(folder and re.match(r'^drwx------(?=\s)',folder))
          folder_mode='0700' if folder_private else 'not-confirmed-0700'
          print('Staging OAuth directory exists:',bool(folder))
          print('Staging OAuth directory owner-only mode:',folder_mode)
          conn.cwd('nckh-private-runtime')
          info=[]
          try:conn.retrlines('LIST',info.append)
          except ftplib.all_errors:pass
          fileinfo=next((x for x in info if x.rstrip().endswith(' oauth.json')),None)
          file_private=bool(fileinfo and re.match(r'^-rw-------(?=\s)',fileinfo))
          print('Private oauth.json exists:',bool(fileinfo))
          print('oauth.json owner-only mode:', '0600' if file_private else 'not-confirmed-0600')
          size=conn.size('oauth.json')
          if size is not None and (size<20 or size>16384):
              print('PASS structural JSON shape:',False)
              raise SystemExit(0)
          memory=io.BytesIO()
          conn.retrbinary('RETR oauth.json',memory.write,blocksize=4096)
          # Never print or upload the bytes, and never dump exception details from malformed JSON.
          try:
              raw=memory.getvalue().decode('utf-8')
              content=json.loads(raw)
              doc=content if isinstance(content,dict) else {}
              web=doc.get('web')
              web=web if isinstance(web,dict) else {}
              key=doc.get('nckh_session_key','')
              # Never show the key, or even its prefix/suffix. Print only shape booleans.
              key_is_string=isinstance(key,str)
              key_is_present='nckh_session_key' in doc
              key_length_ok=key_is_string and len(key)==43
              key_chars_ok=key_is_string and bool(re.fullmatch(r'[A-Za-z0-9_-]+',key))
              key_whitespace=key_is_string and key!=key.strip()
              key_decoded_ok=False
              if key_length_ok and key_chars_ok:
                  try:key_decoded_ok=len(base64.urlsafe_b64decode(key+'='))==32
                  except (ValueError,base64.binascii.Error):pass
              key_ok=key_is_present and key_length_ok and key_chars_ok and key_decoded_ok
              print('Session key field exists:',key_is_present)
              print('Session key is a string:',key_is_string)
              print('Session key length is exactly 43:',key_length_ok)
              print('Session key alphabet is base64url:',key_chars_ok)
              print('Session key includes outer whitespace:',key_whitespace)
              print('Session key decodes to exactly 32 bytes:',key_decoded_ok)
              client_ok=web.get('client_id')=='47081238005-uoj2r9oa0khsoe7jhd69jlabk8hkf3cr.apps.googleusercontent.com'
              secret_ok=isinstance(web.get('client_secret'),str) and len(web['client_secret'])>10
              redirect_ok='https://nghiencuukhoahoc.webnvn.com/api/auth/google/callback' in web.get('redirect_uris',[]) if isinstance(web.get('redirect_uris'),list) else False
              print('oauth.json JSON is valid:',True)
              print('Google web client identifier correct:',client_ok)
              print('Google Web Client Secret structurally present:',secret_ok)
              print('Google staging callback present:',redirect_ok)
              print('32-byte random session key structurally correct:',key_ok)
              print('Private runtime structurally READY:',all([folder_private,file_private,client_ok,secret_ok,redirect_ok,key_ok]))
          except Exception:
              print('oauth.json JSON shape or key failed validation; no private value logged.')
          finally:
              conn.quit()
          PY
