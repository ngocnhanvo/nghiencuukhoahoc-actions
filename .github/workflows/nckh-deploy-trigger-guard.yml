name: Deploy NCKH WordPress GitHub Trigger safety guard
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  deploy_guard:
    if: github.repository == 'ngocnhanvo/nghiencuukhoahoc-actions' && github.event.issue.user.login == 'ngocnhanvo' && github.event.issue.title == '[nckh] Deploy safe trigger plugin'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_PAT: ${{ secrets.SOURCE_REPO_PAT }}
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - name: Deploy only NCKH trigger guard with backup and rollback
        shell: bash
        run: |
          set -euo pipefail
          set +x
          report="${RUNNER_TEMP}/trigger.md"
          printf '## NCKH GitHub Trigger safe deployment\n\n' > "$report"
          done_report() {
            code=$?
            printf '\nExit code: %s\n' "$code" >> "$report"
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" -F body=@"$report" >/dev/null || true
          }
          trap done_report EXIT
          test -n "${SOURCE_PAT:-}"
          curl --fail --silent --show-error --max-time 35 -H "Authorization: Bearer ${SOURCE_PAT}" \
            -H 'Accept: application/vnd.github.raw+json' \
            'https://api.github.com/repos/ngocnhanvo/nghiencuukhoahoc-php/contents/wp-content/plugins/github-trigger/vcs-build-trigger.php?ref=master' \
            -o "${RUNNER_TEMP}/vcs-build-trigger.php"
          php -l "${RUNNER_TEMP}/vcs-build-trigger.php" >/dev/null
          grep -Fq "'nghiencuukhoahoc-actions'" "${RUNNER_TEMP}/vcs-build-trigger.php"
          grep -Fq "'nghiencuukhoahoc.id.vn'" "${RUNNER_TEMP}/vcs-build-trigger.php"
          python3 - "${RUNNER_TEMP}/vcs-build-trigger.php" "$report" <<'PY'
          import os,sys,io,ftplib,time,hashlib
          from urllib.parse import urlparse
          source=open(sys.argv[1],'rb').read()
          report=sys.argv[2]
          def note(msg):
              with open(report,'a',encoding='utf8') as f:f.write('- '+msg+'\n')
          url=os.getenv('FTP_SERVER','')
          u=urlparse(url if '://' in url else 'ftps://'+url)
          ftp=ftplib.FTP_TLS()
          ftp.connect(u.hostname,u.port or 21,timeout=15)
          ftp.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD'])
          ftp.prot_p()
          base='/domains/api-nghiencuukhoahoc.webnvn.com'
          target='public_html/wp-content/plugins/github-trigger/vcs-build-trigger.php'
          ftp.cwd(base)
          previous=io.BytesIO()
          ftp.retrbinary('RETR '+target,previous.write)
          old=previous.getvalue()
          assert b'Plugin Name: GitHub Trigger' in old,'Unexpected plugin target: stop'
          if hashlib.sha256(old).digest()==hashlib.sha256(source).digest():
              note('NCKH trigger is already updated; no file changes.')
              ftp.quit();sys.exit(0)
          safe='nckh-config-backups'
          try:ftp.mkd(safe)
          except ftplib.error_perm as e:
              if not str(e).startswith('550'):raise
          stamp=str(int(time.time()))
          backup=safe+'/vcs-build-trigger-'+stamp+'.php.txt'
          stage=safe+'/vcs-build-trigger-stage-'+stamp+'.php.txt'
          ftp.storbinary('STOR '+backup,io.BytesIO(old))
          ftp.storbinary('STOR '+stage,io.BytesIO(source))
          staged=io.BytesIO()
          ftp.retrbinary('RETR '+stage,staged.write)
          assert hashlib.sha256(staged.getvalue()).digest()==hashlib.sha256(source).digest(),'Staged upload checksum mismatch'
          note('Original plugin stored outside public_html: '+backup)
          renamed=False
          original=safe+'/vcs-build-trigger-original-'+stamp+'.php.txt'
          try:
              ftp.rename(target,original)
              renamed=True
              ftp.rename(stage,target)
              current=io.BytesIO()
              ftp.retrbinary('RETR '+target,current.write)
              assert hashlib.sha256(current.getvalue()).digest()==hashlib.sha256(source).digest(),'Remote plugin checksum mismatch'
              note('NCKH GitHub Trigger file updated and checksum verified.')
              note('WordPress plugin activation state was not changed.')
          except Exception:
              if renamed:
                  try:ftp.delete(target)
                  except ftplib.all_errors:pass
                  ftp.rename(original,target)
                  note('Rolled back to previous plugin file.')
              raise
          finally:
              try:ftp.quit()
              except ftplib.all_errors:pass
          PY
