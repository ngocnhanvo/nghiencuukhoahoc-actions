name: NCKH Live Shared WordPress Brand and Header QA (read-only)
on:
  issues:
    types: [opened]
permissions:
  contents: read
jobs:
  audit:
    if: >-
      github.repository == 'ngocnhanvo/nghiencuukhoahoc-actions'
      && github.event.issue.user.login == 'ngocnhanvo'
      && github.event.issue.title == '[nckh] QA live consistent branding'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare public WP logo and both actual application headers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html,json,re,urllib.request,urllib.parse
          homepage='https://nghiencuukhoahoc.webnvn.com'
          wp='https://api-nghiencuukhoahoc.webnvn.com'
          def get(url,maxsize=600000):
              req=urllib.request.Request(url,headers={
                  'Cache-Control':'no-cache','User-Agent':'NCKH-Public-Brand-ReadOnly-QA/1'
              })
              with urllib.request.urlopen(req,timeout=22) as r:
                  if r.status!=200:raise RuntimeError('Non-200 URL')
                  return r.read(maxsize),r.headers
          rows=json.loads(get(wp+'/wp-json/wp/v2/thong-tin-chung?status=publish&per_page=30')[0])
          if not isinstance(rows,list):raise RuntimeError('WP public Info is not an array')
          entry=next((v for v in rows if (v.get('acf') or {}).get('product_lang')=='vi'),
                     next((v for v in rows if not (v.get('acf') or {}).get('product_lang')),rows[0] if rows else {}))
          fields=entry.get('acf') or {}
          raw_logo=fields.get('logo')
          print('WP_INFO_PUBLIC_DIAGNOSTIC','entries',len(rows),'row_keys',sorted(entry.keys()),
                'acf_present',bool(fields),'logo_type',type(raw_logo).__name__,
                'logo_keys',sorted(raw_logo.keys()) if isinstance(raw_logo,dict) else [],
                'logo_host',urllib.parse.urlparse(str(raw_logo.get('url') or '')).hostname if isinstance(raw_logo,dict) else 'none')
          logo=str((raw_logo or {}).get('url') or '') if isinstance(raw_logo,dict) else ''
          if not logo:
              print('WP_PUBLISHED_MEDIA_EMPTY_USE_HOME_DIAGNOSTIC',True)
          if not logo.startswith(wp+'/wp-content/uploads/'):
              raise RuntimeError('WordPress live brand logo missing or unsafe; refusing to approve fallback E')
          print('WP_PUBLISHED_LOGO_PRESENT',bool(logo))
          home_html=get(homepage+'/')[0].decode('utf8','replace')
          home_img=re.search(r'<a\\b(?=[^>]*aria-label="Về trang chủ")[^>]*>(.*?)</a>',home_html,re.S|re.I)
          if home_img:
              img=re.search(r'<img\\b[^>]*>',home_img.group(1),re.S|re.I)
              if img:
                  src=re.search(r'\\bsrc="([^"]+)"',img.group(0))
                  print('PUBLIC_HOME_LOGO_SRC',html.unescape(src.group(1)) if src else 'missing')
          for path in ('/so-tay','/xem-truoc'):
              text=get(homepage+path)[0].decode('utf8','replace')
              anchor=re.search(r'<a\b(?=[^>]*\bclass="[^"]*nckh-app-brand)[^>]*>(.*?)</a>',text,re.S|re.I)
              if not anchor:raise RuntimeError(path+' missing shared brand')
              brand_img=re.search(r'<img\b(?=[^>]*\bclass="[^"]*nckh-app-brand-image)[^>]*>',anchor.group(1),re.S|re.I)
              if not brand_img:raise RuntimeError(path+' shows the fallback logo, not WordPress')
              src=re.search(r'\bsrc="([^"]+)"',brand_img.group(0))
              if not src or html.unescape(src.group(1))!=logo:
                  raise RuntimeError(path+' image is not the live published WP logo')
              raw=anchor.group(1)
              name=re.search(r'<strong\b[^>]*>(.*?)</strong>',raw,re.S|re.I)
              subtitle=re.search(r'<small\b[^>]*>(.*?)</small>',raw,re.S|re.I)
              if not name or 'EduResearch Hub' not in html.unescape(re.sub(r'<[^>]+>','',name.group(1))):
                  raise RuntimeError(path+' missing correct brand title')
              if not subtitle or not re.search(r'nh[aậ]t k[yý] khoa h[oọ]c',html.unescape(subtitle.group(1)),re.I):
                  raise RuntimeError(path+' missing brand subtitle')
              print('APP_HEADER',path,'PUBLIC_BRAND_MATCH',True,'REAL_LOGO',True)
          data,headers=get(logo,maxsize=1048576)
          if not headers.get('Content-Type','').startswith('image/') or len(data)<100:
              raise RuntimeError('Published logo not accessible as an image')
          print('BRAND_LOGO_HTTP',200,'IMAGE_CONTENT_TYPE_OK',True)
          print('PASS homepage-derived WP brand across real Sổ tay and preview; GET-only, no private account or data read')
          PY