name: NCKH staging public webroot exposure read-only audit
on:
  issues:
    types: [opened]
permissions:
  contents: read
jobs:
  audit:
    if: >-
      github.repository == 'ngocnhanvo/nghiencuukhoahoc-actions'
      && github.event.issue.user.login == 'ngocnhanvo'
      && github.event.issue.title == '[nckh] Audit staging public root'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: HEAD and bounded no-log checks on exact staging only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, urllib.request, urllib.error
          origin='https://nghiencuukhoahoc.webnvn.com'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          opener=urllib.request.build_opener(NoRedirect)
          paths=('/','.env','client/index.html','index.html','server/entry.mjs','xem-truoc/')
          for path in paths:
              url=origin + ('/' if path=='/' else '/'+path)
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'NCKH-Stage-Webroot-Safe-Audit/1.0'},method='GET')
              try:
                  with opener.open(req,timeout=15) as r:
                      status=r.status
                      ctype=r.headers.get('Content-Type','').split(';')[0]
                      # Read at most 1 KB into ephemeral memory; never log bytes.
                      sample=r.read(1024)
              except urllib.error.HTTPError as e:
                  status=e.code
                  ctype=e.headers.get('Content-Type','').split(';')[0]
                  sample=b''
              except Exception as e:
                  print('PATH',path,'ERROR',type(e).__name__)
                  continue
              print('PATH',path,'HTTP',status,'type',ctype)
              if path=='.env':
                  envlike=bool(re.search(rb'(?m)^\s*(?:WC_URL|WC_URL_CLIENT|FTP_SERVER|DB_PASSWORD|NCKH_SESSION_KEY|WP_|SECRET|API_KEY)\s*=',sample))
                  html=sample.lstrip().lower().startswith((b'<!doctype html',b'<html'))
                  print('POSSIBLE_EXPOSED_ENV_CONTENT',envlike,'HTML_FALLBACK',html)
                  if envlike:
                      print('SECURITY_WARNING: content resembles an environment file; isolate and revoke exposed secrets.')
          PY
