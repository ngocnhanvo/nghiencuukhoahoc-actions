name: NCKH homepage deploy QA
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  check:
    if: github.repository == 'ngocnhanvo/nghiencuukhoahoc-actions' && github.event.issue.user.login == 'ngocnhanvo' && github.event.issue.title == '[nckh] Verify deployed homepage'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      WP_USER: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_PASS: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - name: Verify deployed Astro files, live hosts, WP trigger and NCKH identity without modifying
        shell: bash
        run: |
          set -euo pipefail
          set +x
          report="${RUNNER_TEMP}/report.md"
          python3 - "$report" <<'PY'
          import os,sys,io,ftplib,re,json,urllib.request,urllib.parse,http.cookiejar,urllib.error,ssl
          from urllib.parse import urlparse
          report=sys.argv[1]
          lines=['## NCKH deployment QA (read-only)','']
          ftpurl=os.environ['FTP_SERVER']
          target='/domains/nghiencuukhoahoc.webnvn.com/public_html'
          p=urlparse(ftpurl if '://' in ftpurl else 'ftps://'+ftpurl)
          conn=ftplib.FTP_TLS()
          conn.connect(p.hostname,p.port or 21,timeout=17)
          conn.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD'])
          conn.prot_p()
          conn.cwd(target)
          for path in ['server/entry.mjs','client/index.html','.env']:
            buffer=io.BytesIO()
            conn.retrbinary('RETR '+path,buffer.write)
            data=buffer.getvalue()
            lines.append('- FTPS `'+path+'`: **present** ('+str(len(data))+' bytes).')
            if path=='client/index.html':
              assert b'data-nckh-home="2026"' in data,'Not EduResearch homepage'
              assert b'xuongmunonbaohiem' not in data,'Blue Sea domain in index'
              lines.append('- Deployed index HTML: **EduResearch Hub marker verified**, Blue Sea hostname absent.')
          conn.quit()
          lines+=['','### HTTP/HTTPS frontend checks']
          for host in ['nghiencuukhoahoc.webnvn.com','nghiencuukhoahoc.id.vn']:
            for scheme in ['https','http']:
              url=scheme+'://'+host+'/'
              try:
                request=urllib.request.Request(url,headers={'User-Agent':'NCKH-Astro-Postdeploy-QA/1.0'})
                with urllib.request.urlopen(request,timeout=15) as result:
                  raw=result.read(8192)
                  lines.append('- `'+url+'`: HTTP '+str(result.status)+
                    ', final host `'+str(urlparse(result.geturl()).hostname)+'`, EduResearch marker='+
                    str(b'EduResearch Hub' in raw or b'data-nckh-home' in raw)+'.')
              except urllib.error.HTTPError as e:
                lines.append('- `'+url+'`: HTTP '+str(e.code)+'.')
              except Exception as e:
                lines.append('- `'+url+'`: unavailable ('+type(e).__name__+').')
          lines+=['','### WordPress and GitHub Trigger']
          base='https://api-nghiencuukhoahoc.webnvn.com'
          jar=http.cookiejar.CookieJar()
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          def get(path,data=None,headers=None):
            req=urllib.request.Request(base+path,data=data,headers=headers or {})
            with opener.open(req,timeout=20) as r:return r.status,r.geturl(),r.read()
          get('/wp-login.php')
          st,final,_=get('/wp-login.php',urllib.parse.urlencode({
            'log':os.environ['WP_USER'],'pwd':os.environ['WP_PASS'],
            'wp-submit':'Log In','redirect_to':base+'/wp-admin/','testcookie':'1'
          }).encode())
          assert final.startswith(base+'/wp-admin'),'WP login failed'
          st,url,nonce=get('/wp-admin/admin-ajax.php?action=rest-nonce')
          assert re.fullmatch('[A-Za-z0-9]{10,16}',nonce.decode().strip()),'No WP nonce'
          h={'X-WP-Nonce':nonce.decode().strip()}
          st,_,page=get('/wp-json/wp/v2/pages/248?context=edit',headers=h)
          page=json.loads(page)
          assert page.get('acf',{}).get('key')=='home' and page.get('acf',{}).get('action')=='HomePage','WP page metadata changed'
          lines.append('- WordPress Page #248 key=home/action=HomePage: **verified**.')
          st,_,plugins=get('/wp-json/wp/v2/plugins?per_page=100',headers=h)
          trigger=next((v for v in json.loads(plugins) if v.get('plugin')=='github-trigger/vcs-build-trigger'),{})
          lines.append('- WordPress GitHub Trigger status: **'+str(trigger.get('status','unknown'))+'**.')
          try:
            st,_,infos=get('/wp-json/wp/v2/thong-tin-chung?per_page=1&context=edit',headers=h)
            values=json.loads(infos)
            if isinstance(values,list) and values:
              acf=values[0].get('acf') or {}
              domain=str(acf.get('domain',''))
              label='NCKH' if 'nghiencuukhoahoc' in domain else ('Blue Sea/legacy' if 'xuongmunonbaohiem' in domain else 'not classified')
              lines.append('- WordPress site Info domain classification: **'+label+'**.')
          except Exception:
            lines.append('- WP Info domain: not available through public REST endpoint.')
          lines.append('')
          lines.append('Read-only QA. No WordPress or FTP changes.')
          with open(report,'w',encoding='utf8') as f:f.write('\n'.join(lines)+'\n')
          PY
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" -F body=@"$report" >/dev/null
