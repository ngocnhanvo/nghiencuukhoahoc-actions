name: NCKH Remove Redundant Intro Header Link
on:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: nckh-wordpress-menu-edit
  cancel-in-progress: false
jobs:
  remove:
    if: >-
      github.repository == 'ngocnhanvo/nghiencuukhoahoc-actions'
      && github.event.issue.user.login == 'ngocnhanvo'
      && github.event.issue.title == '[nckh] Remove redundant intro header menu'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      WP_USER: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_PASS: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - name: Remove only redundant intro custom link from existing WordPress Header menu
        shell: bash
        run: |
          set -euo pipefail
          set +x
          python3 - <<'PY'
          import http.cookiejar,json,os,re,urllib.error,urllib.parse,urllib.request
          BASE='https://api-nghiencuukhoahoc.webnvn.com'
          MENU_ID=1687
          BEFORE=['Trang chủ','Giới thiệu','Sổ tay NCKH','Giáo viên hướng dẫn','Đánh giá kỹ năng','Khám phá nền tảng']
          AFTER=[s for s in BEFORE if s!='Giới thiệu']
          session=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          def get(path,post=None):
              data=urllib.parse.urlencode(post).encode('utf8') if post is not None else None
              req=urllib.request.Request(BASE+path,data=data,headers={'User-Agent':'NCKH-Clean-Intro-Menu/1.0'})
              with session.open(req,timeout=25) as result:return result.geturl(),result.read(120000)
          def rest(path,nonce,method='GET'):
              req=urllib.request.Request(BASE+path,method=method,headers={'Accept':'application/json','X-WP-Nonce':nonce,'User-Agent':'NCKH-Clean-Intro-Menu/1.0'})
              try:
                  with session.open(req,timeout=25) as result:return result.status,json.loads(result.read(150000))
              except urllib.error.HTTPError as e:
                  status=e.code;e.close();raise RuntimeError('WordPress menu REST HTTP '+str(status))
          get('/wp-login.php')
          redirect,_=get('/wp-login.php',{
              'log':os.environ['WP_USER'],'pwd':os.environ['WP_PASS'],
              'wp-submit':'Log In','redirect_to':BASE+'/wp-admin/','testcookie':'1'})
          if not redirect.startswith(BASE+'/wp-admin'):raise RuntimeError('WP admin login failed; refusing changes')
          _,rawnonce=get('/wp-admin/admin-ajax.php?action=rest-nonce')
          nonce=rawnonce.decode().strip()
          if not re.fullmatch(r'[a-zA-Z0-9]{10,16}',nonce):raise RuntimeError('Invalid WP nonce')
          status,menu=rest('/wp-json/wp/v2/menus/1687?context=edit',nonce)
          if status!=200 or menu.get('name')!='MenuTop':raise RuntimeError('Wrong WordPress menu')
          _,items=rest('/wp-json/wp/v2/menu-items?menus=1687&per_page=100&context=edit',nonce)
          if not isinstance(items,list):raise RuntimeError('Unexpected WP menu response')
          def title(x):
              t=x.get('title',{})
              return t.get('raw','') if isinstance(t,dict) else t
          items=sorted(items,key=lambda x:x.get('menu_order',0))
          current=[title(x) for x in items]
          if current==AFTER:
              print('ALREADY_CLEAN: Intro link absent; no WordPress writes needed')
              raise SystemExit(0)
          if current!=BEFORE or any(x.get('parent')!=0 for x in items):
              raise RuntimeError('Unexpected menu structure; refuse deletion')
          intro=items[1]
          if title(intro)!='Giới thiệu' or intro.get('type')!='custom':
              raise RuntimeError('Unexpected intro menu item; refuse deletion')
          parsed=urllib.parse.urlparse(str(intro.get('url') or ''))
          if parsed.path not in ('','/') or parsed.fragment!='gioi-thieu' or parsed.netloc not in ('','nghiencuukhoahoc.webnvn.com'):
              raise RuntimeError('Intro points somewhere else; refuse deletion')
          _,deleted=rest('/wp-json/wp/v2/menu-items/'+str(intro['id'])+'?force=true',nonce,'DELETE')
          if not deleted.get('deleted') or deleted.get('previous',{}).get('id')!=intro['id']:
              raise RuntimeError('WordPress did not confirm exact item deletion')
          _,after=rest('/wp-json/wp/v2/menu-items?menus=1687&per_page=100&context=edit',nonce)
          after=sorted(after,key=lambda x:x.get('menu_order',0))
          if [title(x) for x in after]!=AFTER or {x['id'] for x in after}!={x['id'] for x in items if x['id']!=intro['id']}:
              raise RuntimeError('Post-write menu has unexpected items')
          print('PASS: removed only redundant Introduction custom link from WordPress MenuTop')
          print('WordPress retained menu labels:',AFTER)
          print('WP-managed homepage and all research database records remain unchanged.')
          PY