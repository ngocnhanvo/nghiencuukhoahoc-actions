name: NCKH sync WordPress GitHub Trigger PHP
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  update:
    if: github.repository == 'ngocnhanvo/nghiencuukhoahoc-actions' && github.event.issue.user.login == 'ngocnhanvo' && github.event.issue.title == '[nckh] Update live GitHub Trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_PAT: ${{ secrets.SOURCE_REPO_PAT }}
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - name: Lint and deploy only NCKH GitHub Trigger PHP; rollback guarded
        shell: bash
        run: |
          set -euo pipefail
          set +x
          report="${RUNNER_TEMP}/report.md"
          printf '## NCKH WordPress GitHub Trigger source synchronization\n\n' > "$report"
          finish() {
            rc=$?
            printf '\nExit code: %s\n' "$rc" >> "$report"
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" -F body=@"$report" >/dev/null || true
          }
          trap finish EXIT
          curl -fsSL --max-time 35 -H "Authorization: Bearer ${SOURCE_PAT}" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/ngocnhanvo/nghiencuukhoahoc-php/contents/wp-content/plugins/github-trigger/vcs-build-trigger.php?ref=master" \
            -o "${RUNNER_TEMP}/vcs-build-trigger.php"
          php -l "${RUNNER_TEMP}/vcs-build-trigger.php" >> "$report"
          python3 - "${RUNNER_TEMP}/vcs-build-trigger.php" "$report" <<'PY'
          import ftplib,io,os,sys,re,hashlib,time
          from urllib.parse import urlparse
          source=open(sys.argv[1],'rb').read()
          report=sys.argv[2]
          if (b'nghiencuukhoahoc-actions' not in source
              or b"DB_NAME !== 'nghiencuukhoahoc_181026'" not in source
              or b'untrailingslashit(site_url())' not in source):
              raise RuntimeError('Expected NCKH-only dispatch guard absent in source')
          p=os.environ['FTP_SERVER']
          target='public_html/wp-content/plugins/github-trigger/vcs-build-trigger.php'
          parsed=urlparse(p if '://' in p else 'ftps://'+p)
          ftp=ftplib.FTP_TLS()
          ftp.connect(parsed.hostname,parsed.port or 21,timeout=18)
          ftp.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD'])
          ftp.prot_p()
          ftp.cwd('/domains/api-nghiencuukhoahoc.webnvn.com')
          wp=io.BytesIO()
          ftp.retrbinary('RETR public_html/wp-config.php',wp.write)
          config=wp.getvalue().decode('utf8','replace')
          assert re.search(r"define\s*\(\s*['\"]DB_NAME['\"]\s*,\s*['\"]nghiencuukhoahoc_181026['\"]",config),'Wrong DB target')
          old=io.BytesIO()
          ftp.retrbinary('RETR '+target,old.write)
          before=old.getvalue()
          expected=hashlib.sha256(source).digest()
          if hashlib.sha256(before).digest()==expected:
              state='Already deployed, sha256 matches GitHub PHP master; no change.'
          else:
              backup_dir='.nckh-rollback'
              try:ftp.mkd(backup_dir)
              except ftplib.error_perm as exc:
                  if not str(exc).startswith('550'):raise
              stamp=str(int(time.time()))
              backup=backup_dir+'/vcs-trigger-'+stamp+'.php.bak'
              stage='public_html/wp-content/plugins/github-trigger/.nckh-vcs-stage-'+stamp+'.php'
              ftp.storbinary('STOR '+stage,io.BytesIO(source))
              uploaded=io.BytesIO()
              ftp.retrbinary('RETR '+stage,uploaded.write)
              assert hashlib.sha256(uploaded.getvalue()).digest()==expected,'Staged plugin checksum mismatch'
              ftp.rename(target,backup)
              try:
                  ftp.rename(stage,target)
                  verified=io.BytesIO()
                  ftp.retrbinary('RETR '+target,verified.write)
                  assert hashlib.sha256(verified.getvalue()).digest()==expected,'Installed plugin checksum mismatch'
              except Exception:
                  try:ftp.delete(target)
                  except ftplib.all_errors:pass
                  ftp.rename(backup,target)
                  raise
              state='Replaced ONLY NCKH Trigger PHP, checksum verified; previous version backed up outside public_html.'
          ftp.quit()
          with open(report,'a',encoding='utf8') as f:
              f.write('- Verified WordPress NCKH DB and exact FTP path.\n')
              f.write('- '+state+'\n')
              f.write('- No Blue Sea/ESC files or website frontend files changed.\n')
          PY
