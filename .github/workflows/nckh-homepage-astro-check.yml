name: Verify EduResearch Hub Homepage Astro
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  check:
    if: github.repository == 'ngocnhanvo/nghiencuukhoahoc-actions' && github.event.issue.user.login == 'ngocnhanvo' && github.event.issue.title == '[nckh] Check EduResearch homepage'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_PAT: ${{ secrets.SOURCE_REPO_PAT }}
    steps:
      - name: Parse updated Astro templates on NCKH development branch (no FTP)
        shell: bash
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/astro-result.md"
          printf '## EduResearch homepage Astro syntax check\n\n' > "$report"
          finish() {
            rc=$?
            printf '\nExit code: %s\n' "$rc" >> "$report"
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" -F body=@"$report" >/dev/null || true
          }
          trap finish EXIT
          git config --global url."https://x-access-token:${SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
          cd "${RUNNER_TEMP}"
          git clone -q --depth 1 --single-branch --branch github https://github.com/ngocnhanvo/nghiencuukhoahoc-astro.git source
          cd source
          printf 'Astro branch: `github`, commit `%s`.\n' "$(git rev-parse HEAD)" >> "$report"
          corepack enable >/dev/null 2>&1
          corepack prepare pnpm@9 --activate >/dev/null 2>&1
          if ! pnpm install --frozen-lockfile --ignore-scripts > "${RUNNER_TEMP}/pnpm-install.log" 2>&1; then
            echo 'Install failed:' >> "$report"
            tail -n 15 "${RUNNER_TEMP}/pnpm-install.log" >> "$report"
            exit 1
          fi
          set +e
          node --input-type=module > "${RUNNER_TEMP}/parse.log" 2>&1 <<'NODE'
          import { createRequire } from 'node:module';
          import { readFile } from 'node:fs/promises';
          const fromAstro = createRequire(new URL('./node_modules/astro/package.json', import.meta.url));
          const { transform } = fromAstro('@astrojs/compiler');
          for (const file of ['src/pages/nckh-home-demo.astro','src/astro/pages/HomePage.astro',
                              'src/astro/components/Layout/Header.astro','src/astro/components/Layout/Footer.astro']) {
            const result = await transform(await readFile(file,'utf8'),{filename:file});
            if(result?.errors?.length) throw new Error(JSON.stringify(result.errors));
            console.log('PASS '+file);
          }
          NODE
          rc=$?
          set -e
          cat "${RUNNER_TEMP}/parse.log" >> "$report"
          printf '\nNo FTP upload, master merge or WordPress changes.\n' >> "$report"
          exit "$rc"
