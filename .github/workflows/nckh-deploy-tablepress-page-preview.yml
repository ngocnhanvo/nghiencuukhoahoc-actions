name: Deploy NCKH page-scoped ESC Table Preview PHP
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  deploy:
    if: github.repository == 'ngocnhanvo/nghiencuukhoahoc-actions' && github.event.issue.user.login == 'ngocnhanvo' && github.event.issue.title == '[nckh] Deploy page preview PHP'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_PAT: ${{ secrets.SOURCE_REPO_PAT }}
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - name: Validate and deploy a single NCKH mu-plugin with FTPS
        shell: bash
        run: |
          set -euo pipefail
          set +x
          report="${RUNNER_TEMP}/nckh-preview-deploy.md"
          printf '## NCKH page-scoped ESC Table preview PHP deployment\n\n' > "$report"
          finish() {
            code=$?
            printf '\nDeployment exit code: %s\n' "$code" >> "$report"
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" -F body=@"$report" >/dev/null || true
          }
          trap finish EXIT
          test -n "${SOURCE_PAT:-}"
          test -n "${FTP_SERVER:-}"
          test -n "${FTP_USERNAME:-}"
          test -n "${FTP_PASSWORD:-}"
          curl -fsSL --max-time 35 -H "Authorization: Bearer ${SOURCE_PAT}" \
            -H 'Accept: application/vnd.github.raw+json' \
            'https://api.github.com/repos/ngocnhanvo/nghiencuukhoahoc-php/contents/wp-content/mu-plugins/nckh-tablepress-page-preview.php?ref=master' \
            -o "${RUNNER_TEMP}/nckh-preview.php"
          php -l "${RUNNER_TEMP}/nckh-preview.php" >> "$report"
          node --check <(printf 'const x=1;\n') >/dev/null 2>&1 || true
          python3 - "${RUNNER_TEMP}/nckh-preview.php" "$report" <<'PY'
          import os,sys,io,ftplib,hashlib,time,re
          from urllib.parse import urlparse
          content=open(sys.argv[1],'rb').read()
          report=sys.argv[2]
          assert b'nckh-tablepress/v1' in content and b'nghiencuukhoahoc_181026' in content
          target='wp-content/mu-plugins/nckh-tablepress-page-preview.php'
          root='/domains/api-nghiencuukhoahoc.webnvn.com/public_html'
          host=os.environ['FTP_SERVER']
          parsed=urlparse(host if '://' in host else 'ftps://'+host)
          ftp=ftplib.FTP_TLS()
          ftp.connect(parsed.hostname,parsed.port or 21,timeout=18)
          ftp.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD'])
          ftp.prot_p()
          ftp.cwd(root)
          config=io.BytesIO()
          ftp.retrbinary('RETR wp-config.php',config.write)
          cf=config.getvalue().decode('utf8','replace')
          assert re.search(r"define\s*\(\s*['\"]DB_NAME['\"]\s*,\s*['\"]nghiencuukhoahoc_181026['\"]",cf),'Target database mismatch'
          try:ftp.mkd('wp-content/mu-plugins')
          except ftplib.error_perm as e:
            if not str(e).startswith('550'):raise
          previous=None
          try:
            old=io.BytesIO()
            ftp.retrbinary('RETR '+target,old.write)
            previous=old.getvalue()
          except ftplib.error_perm as e:
            if not str(e).startswith('550'):raise
          if previous==content:
            status='Already deployed with identical checksum'
          else:
            if previous is not None:
              raise RuntimeError('Existing different file detected. Do not overwrite without reconciling.')
            ftp.storbinary('STOR '+target,io.BytesIO(content))
            remote=io.BytesIO()
            ftp.retrbinary('RETR '+target,remote.write)
            if hashlib.sha256(remote.getvalue()).digest()!=hashlib.sha256(content).digest():
              ftp.delete(target)
              raise RuntimeError('Upload checksum mismatch; rolled back')
            status='Installed new NCKH-only mu-plugin and verified checksum'
          ftp.quit()
          with open(report,'a',encoding='utf8') as f:
            f.write('- Database/FTPS path verified against NCKH.\n')
            f.write('- '+status+'.\n')
            f.write('- No other WordPress or Blue Sea files modified.\n')
          PY
