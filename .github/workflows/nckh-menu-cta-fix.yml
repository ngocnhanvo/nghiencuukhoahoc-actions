name: NCKH WordPress legacy contact menu CTA link fix
on:
  issues:
    types: [opened]
permissions:
  contents: read
jobs:
  update:
    if: >-
      github.repository == 'ngocnhanvo/nghiencuukhoahoc-actions'
      && github.event.issue.user.login == 'ngocnhanvo'
      && github.event.issue.title == '[nckh] Fix WordPress Header CTA linked post'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WP_USER: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_PASS: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - name: Convert stale WordPress Contact page menu item into notebook CTA
        shell: bash
        run: |
          set -euo pipefail
          set +x
          python3 - <<'PY'
          import json,os,re,http.cookiejar,urllib.request,urllib.error,urllib.parse
          base='https://api-nghiencuukhoahoc.webnvn.com'
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          def call(path,data=None,method='GET',nonce=None):
              headers={'User-Agent':'NCKH-WP-CTA-Fix/1','Accept':'application/json'}
              if nonce:headers['X-WP-Nonce']=nonce
              if data is not None:headers['Content-Type']='application/json';data=json.dumps(data,ensure_ascii=False).encode()
              req=urllib.request.Request(base+path,data=data,method=method,headers=headers)
              try:
                  with opener.open(req,timeout=30) as r:return r.status,json.loads(r.read(200000))
              except urllib.error.HTTPError as e:
                  status=e.code;e.close();raise RuntimeError('WP REST '+path.split('?')[0]+' HTTP '+str(status))
          def login(path,body=None):
              request=urllib.request.Request(base+path,data=body,headers={'User-Agent':'NCKH-WP-CTA-Fix/1'})
              with opener.open(request,timeout=30) as r:return r.geturl(),r.read(30000)
          login('/wp-login.php')
          u,_=login('/wp-login.php',urllib.parse.urlencode({
            'log':os.environ['WP_USER'],'pwd':os.environ['WP_PASS'],'wp-submit':'Log In',
            'redirect_to':base+'/wp-admin/','testcookie':'1'}).encode())
          if not u.startswith(base+'/wp-admin'):raise RuntimeError('WP admin login failed')
          _,nonce_raw=login('/wp-admin/admin-ajax.php?action=rest-nonce')
          nonce=nonce_raw.decode().strip()
          if not re.fullmatch('[A-Za-z0-9]{10,16}',nonce):raise RuntimeError('Invalid REST nonce')
          _,item=call('/wp-json/wp/v2/menu-items/53171?context=edit',nonce=nonce)
          if item.get('menus')!=1687 or item.get('parent')!=0:raise RuntimeError('Wrong menu item')
          title=item.get('title',{});label=title.get('raw') if isinstance(title,dict) else title
          if label!='Khám phá nền tảng':raise RuntimeError('CTA identity changed')
          if item.get('type')=='custom' and item.get('url')=='/so-tay':
              print('ALREADY FIXED custom notebook CTA');raise SystemExit(0)
          if item.get('type')!='post_type':raise RuntimeError('Unexpected prior menu type')
          _,out=call('/wp-json/wp/v2/menu-items/53171',{'type':'custom','title':'Khám phá nền tảng','url':'/so-tay',
                    'parent':0,'menu_order':6},'POST',nonce)
          print('POST_UPDATE_TYPE',out.get('type'),'URL_CORRECT',out.get('url')=='/so-tay')
          _,after=call('/wp-json/wp/v2/menu-items/53171?context=edit',nonce=nonce)
          if after.get('type')!='custom' or after.get('url')!='/so-tay':raise RuntimeError('CTA still points to old WordPress contact page')
          _,public=call('/wp-json/esc-api/v1/menus')
          m=public.get('menus',{}).get('Header',{}).get('vi',{})
          items=m.get('items',[])
          print('HEADER_LABELS',[i.get('label') for i in items])
          print('HEADER_LINKS',[str(i.get('href') or i.get('slug') or '')[:130] for i in items])
          if len(items)!=6 or any('so-tay' not in str(i.get('href') or i.get('slug') or '') for i in items[2:]):
              raise RuntimeError('Public Header still missing notebook navigation')
          print('PASS: WordPress Header CTA and all real EduResearch links updated; no other WordPress data touched')
          PY