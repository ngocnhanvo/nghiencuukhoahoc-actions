name: NCKH admin Site Health DB diagnostics
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  read:
    if: github.repository == 'ngocnhanvo/nghiencuukhoahoc-actions' && github.event.issue.title == '[audit] NCKH site health DB' && github.event.issue.user.login == 'ngocnhanvo'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      GH_TOKEN: ${{ github.token }}
      WP_USER: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_PASS: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - name: Inspect administrator Site Health database fields without changing data
        shell: bash
        run: |
          set -euo pipefail
          set +x
          base='https://api-nghiencuukhoahoc.webnvn.com'
          jar="${RUNNER_TEMP}/cookies"
          report="${RUNNER_TEMP}/report.md"
          printf '## NCKH WordPress Site Health database check\n\n' > "$report"
          curl -fsSL -m 15 -c "$jar" -b "$jar" -o /dev/null "$base/wp-login.php"
          curl -fsSL -m 20 -c "$jar" -b "$jar" -o /dev/null \
            --data-urlencode "log=$WP_USER" --data-urlencode "pwd=$WP_PASS" \
            --data-urlencode 'wp-submit=Log In' --data-urlencode "redirect_to=$base/wp-admin/" \
            --data-urlencode 'testcookie=1' "$base/wp-login.php"
          response=$(curl -fsSL -m 20 -b "$jar" -c "$jar" \
            -o "${RUNNER_TEMP}/site-health.html" -w '%{http_code} %{url_effective}' \
            "$base/wp-admin/site-health.php?tab=debug")
          printf 'Site Health page: `%s`\n\n' "$response" >> "$report"
          python3 - "${RUNNER_TEMP}/site-health.html" "$report" <<'PY'
          import sys,re,html
          txt=open(sys.argv[1],encoding='utf8',errors='replace').read()
          labels=['Database name','Database host','Table prefix','Tên cơ sở dữ liệu','Máy chủ cơ sở dữ liệu','Tiền tố bảng']
          with open(sys.argv[2],'a',encoding='utf8') as f:
            f.write('WordPress Site Health field availability:\n')
            for label in labels:
              pattern=re.compile(re.escape(label),re.I)
              present=bool(pattern.search(html.unescape(re.sub('<[^>]+>',' ',txt))))
              f.write(' - '+label+': '+('present' if present else 'not found')+'\n')
            f.write('\nThe diagnostic does not copy database credentials or secrets. The hosting database identifiers still require comparison with Blue Sea.\n')
          PY
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" -F body=@"$report" >/dev/null
