name: NCKH Release QA HTTP, HTTPS and SEO
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  check:
    if: github.repository == 'ngocnhanvo/nghiencuukhoahoc-actions' && github.event.issue.user.login == 'ngocnhanvo' && github.event.issue.title == '[nckh] Final release SEO and SSL audit'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read-only release audit, no WordPress or FTP writes
        shell: bash
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/report.md"
          python3 - "$report" <<'PY'
          import sys,ssl,socket,json,re,urllib.request,urllib.error,urllib.parse,html
          report=sys.argv[1]
          hosts=['nghiencuukhoahoc.webnvn.com','nghiencuukhoahoc.id.vn']
          lines=['## NCKH public release QA (read-only)','']
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':'NCKH-Release-QA/1.0'})
            with urllib.request.urlopen(req,timeout=13) as resp:
              return resp.status,resp.geturl(),resp.read(2_000_000)
          for host in hosts:
            lines+=['### '+host]
            try:
              addrs=sorted({item[4][0] for item in socket.getaddrinfo(host,443,type=socket.SOCK_STREAM)})
              lines.append('- DNS resolves: yes ('+str(len(addrs))+' IPv4/IPv6 address(es))')
            except Exception as err:
              lines.append('- DNS resolves: **no** ('+type(err).__name__+')')
            for protocol in ('http','https'):
              url=protocol+'://'+host+'/'
              try:
                status,final,body=get(url)
                plain=body.decode('utf8','replace')
                lines.append('- '+protocol.upper()+': HTTP '+str(status)+', final='+urllib.parse.urlparse(final).scheme+'://'+str(urllib.parse.urlparse(final).hostname)+', EduResearch='+str('EduResearch Hub' in plain)+', old Blue Sea='+str(bool(re.search('xuongmunonbaohiem|blue.?sea',plain,re.I)))')
                if protocol=='http' and host.endswith('webnvn.com'):
                  titles=re.findall(r'<title[^>]*>([^<]*)</title>',plain,re.I)
                  desc=re.findall(r'<meta[^>]*name=["\']description["\'][^>]*content=["\']([^"\']+)',plain,re.I)
                  canon=re.findall(r'<link[^>]*rel=["\']canonical["\'][^>]*href=["\']([^"\']+)',plain,re.I)
                  lines.append('- HTML title: '+(html.unescape(titles[0])[:160] if titles else '(none)'))
                  lines.append('- Canonical: '+(canon[0][:180] if canon else '(not detected)'))
                  lines.append('- Meta description: '+(desc[0][:140] if desc else '(not detected)'))
                  lines.append('- H1 count: '+str(len(re.findall(r'<h1\\b',plain,re.I))))
              except urllib.error.HTTPError as e:
                lines.append('- '+protocol.upper()+': HTTP '+str(e.code))
              except Exception as e:
                lines.append('- '+protocol.upper()+': **unavailable** ('+type(e).__name__+')')
          lines+=['','### SEO files at current HTTP staging']
          for file in ('robots.txt','sitemap.xml','llms.txt'):
            try:
              status,final,body=get('http://nghiencuukhoahoc.webnvn.com/'+file)
              content=body.decode('utf8','replace')
              lines.append('- '+file+': HTTP '+str(status)+', NCKH canonical='+str('nghiencuukhoahoc.id.vn' in content)+', Blue Sea reference='+str(bool(re.search('xuongmunonbaohiem|blue.?sea',content,re.I)))+', bytes='+str(len(body)))
              if file=='robots.txt':
                lines.append('  - robots sitemap directive: '+str(bool(re.search(r'(?im)^Sitemap:\s*https://nghiencuukhoahoc\.id\.vn/sitemap\.xml',content))))
              if file=='sitemap.xml':
                lines.append('  - canonical root present: '+str('https://nghiencuukhoahoc.id.vn/' in content))
            except Exception as e:
              lines.append('- '+file+': unavailable ('+type(e).__name__+')')
          lines+=['','No DNS/SSL, hosting, WordPress or FTP settings were modified.']
          with open(report,'w',encoding='utf8') as out:out.write('\n'.join(lines)+'\n')
          PY
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" -F body=@"$report" >/dev/null
