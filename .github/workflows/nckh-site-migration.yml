name: NCKH WordPress migration safety tasks
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  migration:
    if: github.repository == 'ngocnhanvo/nghiencuukhoahoc-actions' && github.event.issue.user.login == 'ngocnhanvo' && startsWith(github.event.issue.title, '[nckh] ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WP_USER: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_PASS: ${{ secrets.WP_ADMIN_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
      AUDIT_TITLE: ${{ github.event.issue.title }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Inspect or safely migrate only NCKH WordPress
        shell: bash
        run: |
          set -euo pipefail
          set +x
          base='https://api-nghiencuukhoahoc.webnvn.com'
          jar="${RUNNER_TEMP}/nckh-cookies"
          report="${RUNNER_TEMP}/nckh-report.md"
          printf '# WordPress NCKH site migration\n\nTask: `%s`\n\n' "$AUDIT_TITLE" > "$report"
          finish() {
            code=$?
            printf '\nScript exit status: %s\n' "$code" >> "$report"
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@"$report" >/dev/null || true
          }
          trap finish EXIT
          if [[ -z "${WP_USER:-}" || -z "${WP_PASS:-}" ]]; then
            echo "Missing WordPress admin secrets" >> "$report"
            exit 1
          fi
          curl -fsSL -m 20 -c "$jar" -b "$jar" -o /dev/null "$base/wp-login.php"
          curl -fsSL -m 20 -c "$jar" -b "$jar" --data-urlencode "log=$WP_USER" --data-urlencode "pwd=$WP_PASS" \
            --data-urlencode 'wp-submit=Log In' --data-urlencode "redirect_to=$base/wp-admin/" \
            --data-urlencode 'testcookie=1' -o /dev/null "$base/wp-login.php"
          nonce=$(curl -fsSL -m 15 -b "$jar" -c "$jar" "$base/wp-admin/admin-ajax.php?action=rest-nonce")
          if [[ ! "$nonce" =~ ^[a-zA-Z0-9]{10,16}$ ]]; then
            echo "Could not obtain WordPress REST nonce" >> "$report"
            exit 1
          fi
          fetch() {
            curl -fsSL -m 22 -b "$jar" -c "$jar" -H "X-WP-Nonce: $nonce" "$base/wp-json/wp/v2/$1" -o "$2"
          }
          fetch settings "${RUNNER_TEMP}/settings.json"
          site=$(jq -r '.url // ""' "${RUNNER_TEMP}/settings.json")
          site_title=$(jq -r '.title // ""' "${RUNNER_TEMP}/settings.json")
          case "$site" in
            *api-nghiencuukhoahoc.webnvn.com*) ;;
            *) echo "Unexpected site URL — aborting" >> "$report"; exit 1 ;;
          esac
          printf 'Verified WP identity: **%s**, site URL: `%s`.\n\n' "$site_title" "$site" >> "$report"
          fetch 'users/me?context=edit' "${RUNNER_TEMP}/me.json"
          role=$(jq -r '.roles | join(",")' "${RUNNER_TEMP}/me.json")
          printf 'Authenticated role: `%s`.\n\n' "$role" >> "$report"
          if [[ "$role" != *administrator* ]]; then
            echo "Administrator role missing — aborting" >> "$report"
            exit 1
          fi
          if [[ "$AUDIT_TITLE" == '[nckh] Audit WP state' ]]; then
            curl -fsSL -m 20 -b "$jar" -c "$jar" "$base/wp-admin/options-general.php" -o "${RUNNER_TEMP}/general.html"
            python3 - "${RUNNER_TEMP}/general.html" "$report" <<'PY'
          from html.parser import HTMLParser
          import sys,re,html
          class P(HTMLParser):
            def __init__(self): super().__init__();self.inputs={}
            def handle_starttag(self,tag,attrs):
              if tag!='input': return
              attrs=dict(attrs); name=attrs.get('name','')
              if name in ('siteurl','home'):self.inputs[name]=attrs.get('value','')
          p=P(); p.feed(open(sys.argv[1],encoding='utf8',errors='replace').read())
          with open(sys.argv[2],'a',encoding='utf8') as f:
            for k in ['siteurl','home']:
              value=p.inputs.get(k,'NOT_IN_FORM')
              f.write('WP admin option '+k+': `'+value+'`\n\n')
          PY
            fetch 'plugins?per_page=100' "${RUNNER_TEMP}/plugins.json"
            jq -r '.[] | select(.plugin == "github-trigger/vcs-build-trigger") | "GitHub Trigger status: **" + .status + "**."' "${RUNNER_TEMP}/plugins.json" >> "$report"
            fetch 'pages?per_page=100&context=edit' "${RUNNER_TEMP}/pages.json"
            jq -r '[.[] | {id,slug,status,title:(.title.raw//.title.rendered//""),legacy:((.title.raw//"") + " " + (.slug//"") + " " + (.content.raw//"") | test("blue.?sea|xuongmunonbaohiem|mũ bảo hiểm|nón bảo hiểm";"i"))}] | .[] | "| "+(.id|tostring)+" | "+.slug+" | "+.status+" | "+(if .legacy then "LEGACY" else "REVIEW" end)+" |"' "${RUNNER_TEMP}/pages.json" | { echo '| ID | Slug | Status | Flag |'; echo '|---:|---|---|---|'; cat; } >> "$report"
          else
            echo "Unrecognized action; no changes made." >> "$report"
            exit 1
          fi
          printf '\nNo changes made to WordPress in audit mode.\n' >> "$report"
