name: Install isolated NCKH signed deploy endpoint
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  install:
    if: github.repository == 'ngocnhanvo/nghiencuukhoahoc-actions' && github.event.issue.title == '[nckh] Install signed unzip endpoint' && github.event.issue.user.login == 'ngocnhanvo'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_PAT: ${{ secrets.SOURCE_REPO_PAT }}
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - name: Fetch, lint, install, and verify only NCKH unzip files
        shell: bash
        run: |
          set -euo pipefail
          set +x
          report="${RUNNER_TEMP}/report.md"
          printf '## NCKH signed deployment endpoint installation\n\n' > "$report"
          finish() {
            rc=$?
            printf '\nExit code: %s\n' "$rc" >> "$report"
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" -F body=@"$report" >/dev/null || true
          }
          trap finish EXIT
          test -n "${SOURCE_PAT:-}"
          for name in nckh-unzip.php nckh-unzip-v2.ready; do
            curl -fsSL --max-time 35 -H "Authorization: Bearer ${SOURCE_PAT}" \
              -H "Accept: application/vnd.github.raw+json" \
              "https://api.github.com/repos/ngocnhanvo/nghiencuukhoahoc-php/contents/$name?ref=master" \
              -o "${RUNNER_TEMP}/$name"
          done
          php -l "${RUNNER_TEMP}/nckh-unzip.php" >> "$report"
          python3 - "$report" <<'PY'
          import ftplib,io,os,sys,hashlib,re
          from urllib.parse import urlparse
          report=sys.argv[1]
          root='/domains/api-nghiencuukhoahoc.webnvn.com/public_html'
          ftpstr=os.environ['FTP_SERVER']
          x=urlparse(ftpstr if '://' in ftpstr else 'ftps://'+ftpstr)
          ftp=ftplib.FTP_TLS()
          ftp.connect(x.hostname,x.port or 21,timeout=17)
          ftp.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD'])
          ftp.prot_p()
          ftp.cwd(root)
          wp=io.BytesIO()
          ftp.retrbinary('RETR wp-config.php',wp.write)
          assert re.search(r"define\s*\(\s*['\"]DB_NAME['\"]\s*,\s*['\"]nghiencuukhoahoc_181026['\"]",wp.getvalue().decode('utf8','replace')),'Wrong DB'
          installed=[]
          for name in ('nckh-unzip.php','nckh-unzip-v2.ready'):
            source=open(os.environ['RUNNER_TEMP']+'/'+name,'rb').read()
            previous=io.BytesIO()
            try:
              ftp.retrbinary('RETR '+name,previous.write)
              if hashlib.sha256(previous.getvalue()).digest()!=hashlib.sha256(source).digest():
                raise RuntimeError('Existing different '+name+' must not be overwritten')
              installed.append(name+': already matching')
            except ftplib.error_perm as e:
              if not str(e).startswith('550'):raise
              ftp.storbinary('STOR '+name,io.BytesIO(source))
              verify=io.BytesIO()
              ftp.retrbinary('RETR '+name,verify.write)
              if hashlib.sha256(verify.getvalue()).digest()!=hashlib.sha256(source).digest():
                ftp.delete(name)
                raise RuntimeError(name+' upload checksum mismatch')
              installed.append(name+': installed')
          ftp.quit()
          with open(report,'a',encoding='utf8') as f:
            f.write('Verified NCKH DB and exact WordPress directory.\n')
            f.write('\n'.join('- '+line for line in installed)+'\n')
          PY
          curl --fail --silent --show-error --max-time 15 \
            "https://api-nghiencuukhoahoc.webnvn.com/nckh-unzip-v2.ready" \
            -o "${RUNNER_TEMP}/ready.txt"
          grep -Fxq 'NCKH_ASTRO_UNZIP_PROTOCOL=2' "${RUNNER_TEMP}/ready.txt"
          echo '- HTTPS readiness marker served correctly.' >> "$report"
