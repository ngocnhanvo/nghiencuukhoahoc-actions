name: Read-only public site isolation check
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  check:
    if: github.event.issue.title == '[audit] NCKH and Blue Sea public isolation' && github.event.issue.user.login == 'ngocnhanvo'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Compare DNS, redirects and public WordPress REST metadata
        shell: bash
        run: |
          set -u
          report="${RUNNER_TEMP}/comparison.md"
          printf '## Public isolation check (no login)\n\n| Domain | IP | Web HTTP/final URL | WordPress REST name/url |\n|---|---|---|---|\n' > "$report"
          for host in api-nghiencuukhoahoc.webnvn.com xuongmunonbaohiem.com admin.xuongmunonbaohiem.io.vn; do
            ip=$(getent ahostsv4 "$host" | awk 'NR==1 {print $1}' || true)
            result=$(curl -ksSL -m 15 --max-redirs 3 -o /dev/null -w '%{http_code} %{url_effective}' "https://$host/" 2>/dev/null || true)
            rest=$(curl -ksSL -m 15 --max-redirs 3 -o "${RUNNER_TEMP}/rest.json" -w '%{http_code}' "https://$host/wp-json/" 2>/dev/null || true)
            name=$(jq -r '.name // "unknown"' "${RUNNER_TEMP}/rest.json" 2>/dev/null | head -c 90 || true)
            url=$(jq -r '.url // "unknown"' "${RUNNER_TEMP}/rest.json" 2>/dev/null | head -c 110 || true)
            printf '| %s | %s | %s | %s: %s / %s |\n' "$host" "${ip:-unknown}" "${result:-failed}" "${rest:-000}" "${name:-unknown}" "${url:-unknown}" >> "$report"
          done
          printf '\nSame IP does not imply same database; different WordPress site URLs do not prove database isolation. No site changes were made.\n' >> "$report"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" -F body=@"$report" >/dev/null
