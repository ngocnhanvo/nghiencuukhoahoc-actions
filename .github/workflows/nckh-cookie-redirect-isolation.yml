name: NCKH Staging Cookie and Redirect Route Isolation
on:
  issues:
    types: [opened]
permissions:
  contents: read
jobs:
  probe:
    if: >-
      github.repository == 'ngocnhanvo/nghiencuukhoahoc-actions'
      && github.event.issue.user.login == 'ngocnhanvo'
      && github.event.issue.title == '[nckh] Diagnose staging cookie redirect behavior'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare Astro cookie mutations with redirects on staging without logging cookies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import time,urllib.request,urllib.error
          base='https://nghiencuukhoahoc.webnvn.com/api/nckh-runtime-probe'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          opener=urllib.request.build_opener(NoRedirect)
          for variant in ['plain','redirect','set','set-redirect','delete','delete-redirect']:
              req=urllib.request.Request(base+'?variant='+variant,method='GET',
                  headers={'Cache-Control':'no-cache','User-Agent':'NCKH-Temporary-Stage-Cookie-Isolation/1'})
              t=time.monotonic()
              try:
                  with opener.open(req,timeout=7) as r:
                      code=r.status;kind=r.headers.get('Content-Type','').split(';')[0]
              except urllib.error.HTTPError as e:
                  code=e.code;kind=e.headers.get('Content-Type','').split(';')[0];e.close()
              except Exception as e:
                  print('VARIANT',variant,'ERROR',type(e).__name__,'seconds',round(time.monotonic()-t,2))
                  continue
              print('VARIANT',variant,'HTTP',code,'type',kind,'seconds',round(time.monotonic()-t,2))
          print('No private content, cookies, OAuth state or redirect URLs logged.')
          PY