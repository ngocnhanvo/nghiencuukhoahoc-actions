name: NCKH Launch via WordPress GitHub Trigger
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
concurrency:
  group: nckh-wp-trigger-launch
  cancel-in-progress: false
jobs:
  trigger:
    if: github.repository == 'ngocnhanvo/nghiencuukhoahoc-actions' && github.event.issue.user.login == 'ngocnhanvo' && github.event.issue.title == '[nckh] Launch from WordPress Trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      GH_TOKEN: ${{ github.token }}
      WP_USER: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_PASS: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - name: Authenticated WordPress Build Website action (no direct FTP)
        shell: bash
        run: |
          set -euo pipefail
          set +x
          report="${RUNNER_TEMP}/nckh-trigger.md"
          printf '## NCKH WordPress GitHub Trigger launch\n\n' > "$report"
          finish() {
            rc=$?
            printf '\nExit code: %s\n' "$rc" >> "$report"
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" -F body=@"$report" >/dev/null || true
          }
          trap finish EXIT
          python3 - "$report" <<'PY'
          import sys,os,json,re,urllib.request,urllib.parse,http.cookiejar
          url='https://api-nghiencuukhoahoc.webnvn.com'
          report=sys.argv[1]
          def log(text):
            with open(report,'a',encoding='utf8') as f:f.write(text+'\n')
          browser=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          def req(path,body=None):
            request=urllib.request.Request(url+path,data=body)
            with browser.open(request,timeout=33) as res:return res.status,res.geturl(),res.read()
          req('/wp-login.php')
          status,target,_=req('/wp-login.php',urllib.parse.urlencode({
            'log':os.environ['WP_USER'],'pwd':os.environ['WP_PASS'],
            'wp-submit':'Log In','redirect_to':url+'/wp-admin/','testcookie':'1'
          }).encode())
          assert target.startswith(url+'/wp-admin/'),'WordPress admin login failed'
          status,target,html=req('/wp-admin/admin.php?page=vcs-build-trigger')
          assert status==200 and target.startswith(url+'/wp-admin/'),'WP GitHub Trigger UI inaccessible'
          page=html.decode('utf8','replace')
          m=re.search(r'\bvar\s+vcsBuild\s*=\s*(\{[\s\S]*?\});',page)
          if not m:
            raise RuntimeError('WordPress GitHub Trigger nonce was not present')
          state=json.loads(m.group(1))
          nonce=state.get('nonce','')
          assert re.fullmatch('[A-Za-z0-9]{10,16}',nonce),'Invalid WordPress build nonce'
          if state.get('initial_active'):
            log('WordPress reports another build in progress. Refused duplicate dispatch.')
            raise RuntimeError('A build is already running')
          payload=urllib.parse.urlencode({
            'action':'vcs_trigger_build',
            'nonce':nonce,
            'force_build':'1'
          }).encode('utf8')
          status,_,raw=req('/wp-admin/admin-ajax.php',payload)
          assert status==200,'Build request not accepted by WP admin endpoint'
          response=json.loads(raw)
          if not response.get('success'):
            reason=str((response.get('data') or {}).get('message','WordPress rejected build'))
            log('WordPress GitHub Trigger rejected dispatch: '+reason[:220])
            raise RuntimeError('Trigger rejected build')
          log('WordPress GitHub Trigger accepted one forced build request.')
          log('Dispatch target: `ngocnhanvo/nghiencuukhoahoc-actions`, `wp_trigger_build`.')
          log('This workflow does not perform FTP uploads or modify Astro source.')
          log('Check official build/deploy runs at https://github.com/ngocnhanvo/nghiencuukhoahoc-actions/actions')
          PY
