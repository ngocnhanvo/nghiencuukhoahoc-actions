name: NCKH Astro homepage build validation
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  build:
    if: github.repository == 'ngocnhanvo/nghiencuukhoahoc-actions' && github.event.issue.user.login == 'ngocnhanvo' && github.event.issue.title == '[nckh] Validate homepage build'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      ENV_FILE: ${{ secrets.ENV_FILE }}
      SOURCE_PAT: ${{ secrets.SOURCE_REPO_PAT }}
    steps:
      - name: Checkout NCKH Astro development branch
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/nghiencuukhoahoc-astro
          ref: github
          token: ${{ secrets.SOURCE_REPO_PAT }}
          persist-credentials: false
      - name: Node and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies and securely prepare env
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9 --activate
          pnpm install --frozen-lockfile > "${RUNNER_TEMP}/install.log" 2>&1 || { tail -n 35 "${RUNNER_TEMP}/install.log"; exit 1; }
          python3 - <<'PY'
          import os,re
          text=os.getenv('ENV_FILE','')
          assert text.strip(),'ENV_FILE secret missing'
          allowed={'WC_URL','WC_URL_CLIENT','WOO_KEY','WOO_SECRET','RESEND_API_KEY','CLOUDFLARE_TURNSTILE_SECRET_KEY','rootDir'}
          got={}
          for line in text.splitlines():
            match=re.match(r'^\s*(?:export\s+)?([A-Za-z_][\w]*)\s*=\s*(.*)\s*$',line)
            if not match:continue
            key,value=match.groups()
            if key not in allowed:continue
            value=value.strip().strip("'\"")
            if '\n' in value or '\r' in value:raise ValueError('Invalid env value')
            got[key]=value
          assert got.get('WC_URL','').rstrip('/')=='https://api-nghiencuukhoahoc.webnvn.com','Wrong WP URL in ENV_FILE'
          assert got.get('WC_URL_CLIENT','').rstrip('/') in ('https://nghiencuukhoahoc.id.vn','https://nghiencuukhoahoc.webnvn.com'),'Wrong NCKH client origin'
          got.update({'cacheAll':'false','cachePage':'false','cacheProduct':'false','cacheTablePress':'false','cacheRedirect':'false','cacheMenu':'false','cacheProductCategory':'false','NODE_ENV':'production','NCKH_HOMEPAGE_ONLY_BUILD':'true'})
          with open(os.environ['GITHUB_ENV'],'a') as f:
            for k,v in got.items():f.write(k+'='+v+'\n')
          PY
      - name: Build Astro and check generated homepage (no FTP)
        shell: bash
        run: |
          set -uo pipefail
          set +x
          report="${RUNNER_TEMP}/report.md"
          printf '## NCKH Astro homepage build\n\n' > "$report"
          printf 'Source branch: `github`, SHA `%s`.\n\n' "${GITHUB_SHA}" >> "$report"
          finish() {
            rc=$?
            printf '\nExit code: %s\n' "$rc" >> "$report"
            gh api -X POST "repos/ngocnhanvo/nghiencuukhoahoc-actions/issues/${{ github.event.issue.number }}/comments" -F body=@"$report" >/dev/null || true
          }
          trap finish EXIT
          if pnpm exec astro build > "${RUNNER_TEMP}/astro-build.log" 2>&1; then
            echo '- Astro build: **PASS**.' >> "$report"
          else
            echo '- Astro build: **FAIL**.' >> "$report"
            echo '### Last build output' >> "$report"
            tail -n 75 "${RUNNER_TEMP}/astro-build.log" | sed -E 's#https?://[^ ]+#<url>#g' >> "$report"
            exit 1
          fi
          result=$(find dist -type f \( -name '*.html' -o -name '*.htm' \) | head -n 25)
          echo "### Generated HTML (first 25 paths)" >> "$report"
          printf '%s\n' "$result" >> "$report"
          if grep -rql 'data-nckh-home="2026"' dist --include='*.html'; then
            echo '- EduResearch WordPress homepage marker: **PASS**.' >> "$report"
          else
            echo '- EduResearch WordPress homepage marker: **NOT FOUND**.' >> "$report"
            exit 1
          fi
          if grep -rql 'xuongmunonbaohiem.com' dist/index.html dist/client/index.html 2>/dev/null; then
            echo '- ERROR: Blue Sea domain found in generated home.' >> "$report";exit 1
          fi
          echo '- No FTP upload, production merge or WordPress changes.' >> "$report"
