name: NCKH Read CI Status
on:
  issues:
    types: [opened]
permissions:
  actions: read
  contents: read
  issues: write
jobs:
  status:
    if: github.repository == 'ngocnhanvo/nghiencuukhoahoc-actions' && github.event.issue.user.login == 'ngocnhanvo' && github.event.issue.title == '[nckh] Check official CI'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Report recent GitHub Trigger CI runs
        shell: bash
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/ci-status.md"
          printf '## NCKH production workflow dry-run status\n\n' > "$report"
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-astro.yml/runs?per_page=5" --jq \
            '.workflow_runs[] | "- Run: " + (.id|tostring) + " / " + .event + " / " + .status + " / " + (.conclusion//"pending") + " — " + .html_url' >> "$report"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" -F body=@"$report" >/dev/null
