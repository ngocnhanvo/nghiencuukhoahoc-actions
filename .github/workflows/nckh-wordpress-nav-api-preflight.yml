name: NCKH native WP menu API preflight read only
on:
  issues:
    types: [opened]
permissions:
  contents: read
jobs:
  inspect:
    if: >-
      github.repository == 'ngocnhanvo/nghiencuukhoahoc-actions'
      && github.event.issue.user.login == 'ngocnhanvo'
      && github.event.issue.title == '[nckh] Inspect WordPress editable header menu'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WP_USER: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_PASS: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - name: Check header nav_menu item REST API authenticated read-only
        shell: bash
        run: |
          set -euo pipefail
          set +x
          python3 - <<'PY'
          import json,os,re,urllib.request,urllib.error,urllib.parse,http.cookiejar
          base='https://api-nghiencuukhoahoc.webnvn.com'
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          def call(path,data=None,headers=None):
              req=urllib.request.Request(base+path,data=data,headers=headers or {'User-Agent':'NCKH-WP-Menu-ReadOnly/1'})
              try:
                  with opener.open(req,timeout=25) as r:
                      return r.status,r.geturl(),r.read(350000)
              except urllib.error.HTTPError as e:
                  return e.code,e.geturl(),e.read(1000)
          call('/wp-login.php')
          status,url,_=call('/wp-login.php',urllib.parse.urlencode({'log':os.environ['WP_USER'],'pwd':os.environ['WP_PASS'],'wp-submit':'Log In','redirect_to':base+'/wp-admin/','testcookie':'1'}).encode())
          if not url.startswith(base+'/wp-admin'):raise RuntimeError('WP admin authentication failed')
          st,_,nonceraw=call('/wp-admin/admin-ajax.php?action=rest-nonce')
          nonce=nonceraw.decode().strip()
          if not re.fullmatch('[A-Za-z0-9]{10,16}',nonce):raise RuntimeError('REST nonce unavailable')
          for path in ('/wp-json/wp/v2/menus/1687?context=edit',
                       '/wp-json/wp/v2/menu-items?menus=1687&per_page=100&context=edit',
                       '/wp-json/wp/v2/menu-items?per_page=3&context=edit'):
              status,_,body=call(path,headers={'X-WP-Nonce':nonce,'Accept':'application/json'})
              try: obj=json.loads(body)
              except:obj=None
              if isinstance(obj,list):
                  print('REST',path,'HTTP',status,'COUNT',len(obj),'items',[{
                    'id':v.get('id'),'title':str(v.get('title',{}).get('raw','') if isinstance(v.get('title'),dict) else v.get('title',''))[:60],
                    'url':str(v.get('url',''))[:140],'menus':v.get('menus'),
                    'parent':v.get('parent'),'type':v.get('type'),'status':v.get('status')
                  } for v in obj[:15]])
              elif isinstance(obj,dict):
                  print('REST',path,'HTTP',status,'id',obj.get('id'),'name',obj.get('name'),'slug',obj.get('slug'),'code',obj.get('code'))
              else: print('REST',path,'HTTP',status,'format unknown')
          print('Read-only; no WordPress writes or secret logs.')
          PY