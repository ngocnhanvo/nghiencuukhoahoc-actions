name: NCKH deployment environment audit
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  audit:
    if: github.repository == 'ngocnhanvo/nghiencuukhoahoc-actions' && github.event.issue.title == '[audit] NCKH deployment environment' && github.event.issue.user.login == 'ngocnhanvo'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      GH_TOKEN: ${{ github.token }}
      ENV_FILE: ${{ secrets.ENV_FILE }}
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - name: Identify configured environment and HTTPS verification without exposing secrets
        shell: bash
        run: |
          set -uo pipefail
          set +x
          report="${RUNNER_TEMP}/report.md"
          printf '## NCKH deployment environment safety check\n\n' > "$report"
          for field in ENV_FILE FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            if [ -n "${!field:-}" ]; then
              echo "- Secret \`$field\`: **present**" >> "$report"
            else
              echo "- Secret \`$field\`: **missing**" >> "$report"
            fi
          done
          echo "" >> "$report"
          if [ -n "${ENV_FILE:-}" ]; then
            for key in WC_URL WC_URL_CLIENT DOMAIN DEPLOY_DIR FTP_REMOTE_DIR FTP_PATH FTP_TARGET_DIR ROOT_DIR; do
              value=$(printf '%s\n' "$ENV_FILE" | sed -n "s/^$key=//p" | tail -n 1 | tr -d '\r' || true)
              [ -n "$value" ] || continue
              classification="other/unknown"
              if [[ "$value" == *nghiencuukhoahoc* ]]; then classification="NCKH"; fi
              if [[ "$value" == *xuongmunonbaohiem* || "$value" == *tuannguyen.io.vn* ]]; then classification="BLUE_SEA_OLD_DOMAIN"; fi
              printf ' - `%s` in ENV_FILE: **%s** (full value withheld).\n' "$key" "$classification" >> "$report"
            done
          fi
          echo '' >> "$report"
          for host in api-nghiencuukhoahoc.webnvn.com nghiencuukhoahoc.id.vn; do
            out=$(curl -sSL --max-redirs 3 --connect-timeout 6 --max-time 17 -o /dev/null -w '%{http_code} %{ssl_verify_result} %{url_effective}' "https://$host/" 2>/dev/null || true)
            printf ' - HTTPS `%s`: `%s` (SSL verify result 0 = valid certificate).\n' "$host" "${out:-unavailable}" >> "$report"
          done
          printf '\nNo secrets were displayed and no FTP uploads or WordPress writes occurred.\n' >> "$report"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" -F body=@"$report" >/dev/null
